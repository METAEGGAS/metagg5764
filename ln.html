<!DOCTYPE html><html dir="rtl" lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>لوحة تحكم دعم DunFin</title><style>*{box-sizing:border-box;margin:0;font-family:Tahoma,Arial,sans-serif}html,body{height:100%;background:#0b141a;color:#e9edef}#gate{height:100%;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}#gate input{padding:12px 16px;border-radius:8px;border:1px solid #2a3942;background:#202c33;color:#fff;font-size:16px;outline:0;text-align:center}#gate button{padding:12px 34px;border:0;border-radius:8px;background:#00a884;color:#fff;font-size:16px;font-weight:700;cursor:pointer}#ge{color:#f15c6d;font-size:13px}#app{display:none;height:100%}.wrap{display:flex;height:100%}#side{width:320px;min-width:260px;border-left:1px solid #222d34;display:flex;flex-direction:column;background:#111b21}#sh{display:flex;gap:6px;padding:10px;background:#202c33;align-items:center}#sh b{flex:1;font-size:17px}#sh button,#sh select{background:#2a3942;color:#e9edef;border:0;border-radius:6px;padding:7px 10px;cursor:pointer;font-size:13px}#list{flex:1;overflow-y:auto}.u{padding:12px;border-bottom:1px solid #222d34;cursor:pointer;display:flex;gap:10px;align-items:center}.u:hover,.u.on{background:#202c33}.av{width:42px;height:42px;border-radius:50%;background:#00a884;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}.ui{flex:1;min-width:0}.un{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.up{font-size:12px;color:#8696a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bd{background:#f0c419;color:#000;border-radius:10px;font-size:11px;font-weight:700;padding:2px 7px;flex:none}#chat{flex:1;display:flex;flex-direction:column;position:relative}#ch{display:none;padding:10px 14px;background:#202c33;align-items:center;gap:10px}#ch b{flex:1;font-size:15px;word-break:break-all}#msgs{flex:1;overflow-y:auto;padding:16px 8%;display:none;flex-direction:column;gap:6px}#msgs.on{display:flex}.m{max-width:65%;padding:8px 12px;border-radius:10px;font-size:14.5px;line-height:1.6;word-wrap:break-word}.m small{display:block;text-align:left;font-size:10px;color:#8696a0;margin-top:3px}.m.a{align-self:flex-start;background:#005c4b;border-radius:10px 0 10px 10px}.m.u2{align-self:flex-end;background:#202c33;border-radius:0 10px 10px 10px}.m img{max-width:220px;border-radius:8px;display:block}#bar{display:none;padding:8px 12px;background:#202c33;gap:8px}#bar input{flex:1;border:0;outline:0;border-radius:20px;padding:11px 16px;background:#2a3942;color:#fff;font-size:15px}#bar button{border:0;border-radius:50%;width:44px;height:44px;background:#00a884;color:#fff;font-size:18px;cursor:pointer;flex:none}#empty{flex:1;display:flex;align-items:center;justify-content:center;color:#8696a0;font-size:16px}#back{display:none;background:none;border:0;color:#fff;font-size:22px;cursor:pointer}@media(max-width:700px){#side{width:100%;min-width:0;border:0}#chat{position:fixed;inset:0;display:none;z-index:5;background:#0b141a}#chat.open{display:flex}#back{display:block}}</style></head><body><div id="gate"><h2>🔐 لوحة تحكم الدعم</h2><input id="pw" type="password" placeholder="كلمة المرور"><button id="go">دخول</button><div id="ge"></div></div><div id="app"><div class="wrap"><div id="side"><div id="sh"><b>💬 المحادثات</b><select id="mode"><option value="users">حقيقي</option><option value="sim">محاكاة</option></select><button id="ref">🔄</button></div><div id="list"></div></div><div id="chat"><div id="ch"><button id="back">→</button><b id="ct"></b></div><div id="empty">اختر محادثة من القائمة 👈</div><div id="msgs"></div><div id="bar"><input id="inp" placeholder="اكتب ردّك..."><button id="snd">➤</button></div></div></div></div><script type="module">import{initializeApp}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";import{getFirestore,collection,getDocs,onSnapshot,addDoc,serverTimestamp}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";const PASS="dunfin2026",db=getFirestore(initializeApp({apiKey:"AIzaSyBvzfJOOjRFZnTgTUrwEZQPr8Ba7zKKlNg",authDomain:"hhhxh-5ebe4.firebaseapp.com",projectId:"hhhxh-5ebe4",storageBucket:"hhhxh-5ebe4.firebasestorage.app",messagingSenderId:"79243000696",appId:"1:79243000696:web:ee0fb2d2ccce791954e68d"})),$=i=>document.getElementById(i),E=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),TM=t=>new Date(t||0).toLocaleString('ar-EG',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'});let MODE='users',cur=null,un=null;const CS=u=>collection(db,MODE,u,'customerService');async function list(){try{const us=await getDocs(collection(db,MODE)),rows=[];for(const d of us.docs){const ms=await getDocs(CS(d.id));if(ms.empty)continue;let lt=null,nr=0,rd=+localStorage['dfR_'+d.id]||0;ms.forEach(m=>{const x=m.data();if(!lt||(x.ts||0)>(lt.ts||0))lt=x;if(x.sender==='user'&&(x.ts||0)>rd)nr++});rows.push({u:d.id,l:lt,n:nr})}rows.sort((a,b)=>(b.l.ts||0)-(a.l.ts||0));$('list').innerHTML=rows.length?rows.map(r=>`<div class="u${r.u===cur?' on':''}" data-u="${r.u}"><div class="av">👤</div><div class="ui"><div class="un">${E(r.u)}</div><div class="up">${r.l?(r.l.sender==='admin'?'أنت: ':'')+E(r.l.type==='image'?'📷 صورة':r.l.text||''):''} · ${TM(r.l&&r.l.ts)}</div></div>${r.n?`<span class="bd">${r.n}</span>`:''}</div>`).join(''):'<div style="padding:20px;color:#8696a0;text-align:center">لا توجد محادثات بعد</div>'}catch(e){$('list').innerHTML='<div style="padding:20px;color:#f15c6d;text-align:center">خطأ: '+E(e.message)+'</div>'}}function draw(a){const g=$('msgs');g.innerHTML=a.map(m=>`<div class="m ${m.sender==='admin'?'a':'u2'}">${m.type==='image'&&m.image?`<img src="${m.image}">`:E(m.text||'').replace(/\n/g,'<br>')}<small>${m.sender==='admin'?'أنت':'المستخدم'} · ${TM(m.ts)}</small></div>`).join('');g.scrollTop=g.scrollHeight}function open(u){cur=u;un&&un();$('ct').textContent=u;$('empty').style.display='none';$('msgs').classList.add('on');$('bar').style.display='flex';$('ch').style.display='flex';$('chat').classList.add('open');un=onSnapshot(CS(u),q=>{const a=[];q.forEach(v=>a.push(v.data()));a.sort((x,y)=>(x.ts||0)-(y.ts||0));draw(a);localStorage['dfR_'+u]=a.reduce((m,x)=>Math.max(m,x.ts||0),0);list()})}async function send(){const v=$('inp').value.trim();if(!v||!cur)return;$('inp').value='';await addDoc(CS(cur),{uid:cur,sender:'admin',type:'text',text:v,ts:Date.now(),createdAt:serverTimestamp()})}$('go').onclick=()=>{if($('pw').value===PASS){$('gate').style.display='none';$('app').style.display='block';list();setInterval(list,3e4)}else $('ge').textContent='كلمة المرور غير صحيحة'};$('pw').onkeydown=e=>e.key==='Enter'&&$('go').click();$('ref').onclick=list;$('mode').onchange=e=>{MODE=e.target.value;cur=null;un&&un();$('empty').style.display='flex';$('msgs').classList.remove('on');$('bar').style.display='none';$('ch').style.display='none';list()};$('list').onclick=e=>{const t=e.target.closest('.u');t&&open(t.dataset.u)};$('snd').onclick=send;$('inp').onkeydown=e=>e.key==='Enter'&&send();$('back').onclick=()=>$('chat').classList.remove('open');</script></body></html>
