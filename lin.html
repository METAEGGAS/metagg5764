<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن - ASSe Platform</title>
    <style>
        /* أنماط متقدمة وجذابة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Tajawal', 'Segoe UI', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        /* شريط التنقل */
        .navbar {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        
        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(45deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .admin-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .admin-badge {
            background: rgba(245, 87, 108, 0.2);
            padding: 5px 15px;
            border-radius: 20px;
            border: 1px solid #f5576c;
            font-size: 12px;
            color: #f5576c;
        }
        
        .logout-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .logout-btn:hover {
            background: rgba(245, 87, 108, 0.2);
            border-color: #f5576c;
        }
        
        /* بطاقات الإحصائيات */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            transition: transform 0.3s;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
        }
        
        .stat-number {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(45deg, #f093fb, #f5576c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .stat-label {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 5px;
        }
        
        /* التبويبات */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .tab-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: rgba(255, 255, 255, 0.6);
            padding: 10px 25px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            background: rgba(245, 87, 108, 0.2);
            border-color: #f5576c;
            color: #fff;
        }
        
        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        
        /* جدول البيانات */
        .table-wrapper {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            overflow-x: auto;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        
        thead {
            background: rgba(245, 87, 108, 0.1);
        }
        
        th {
            padding: 15px 20px;
            text-align: right;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 600;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            white-space: nowrap;
        }
        
        td {
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.8);
        }
        
        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }
        
        /* حالة المستخدم */
        .status-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            display: inline-block;
        }
        
        .status-active {
            background: rgba(46, 213, 115, 0.2);
            color: #2ed573;
        }
        
        .status-inactive {
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
        }
        
        .status-pending {
            background: rgba(255, 165, 0, 0.2);
            color: #ffa502;
        }
        
        /* شريط البحث والفلترة */
        .filters {
            display: flex;
            gap: 15px;
            padding: 15px 20px;
            flex-wrap: wrap;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .filters input, .filters select {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 15px;
            border-radius: 8px;
            font-size: 14px;
            min-width: 150px;
        }
        
        .filters input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        
        .filters input:focus, .filters select:focus {
            outline: none;
            border-color: #f5576c;
        }
        
        .filters select option {
            background: #24243e;
        }
        
        /* رسائل التنبيه */
        .alert {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }
        
        .alert-danger {
            background: rgba(255, 71, 87, 0.1);
            border: 1px solid rgba(255, 71, 87, 0.3);
            color: #ff4757;
            display: block;
        }
        
        .alert-success {
            background: rgba(46, 213, 115, 0.1);
            border: 1px solid rgba(46, 213, 115, 0.3);
            color: #2ed573;
            display: block;
        }
        
        /* زر التحميل */
        .loading {
            text-align: center;
            padding: 40px;
            color: rgba(255, 255, 255, 0.4);
        }
        
        .loading::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: #f5576c;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 10px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* التجاوب */
        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            
            .admin-info {
                justify-content: center;
                flex-wrap: wrap;
            }
            
            th, td {
                padding: 10px 12px;
                font-size: 12px;
            }
            
            .filters {
                flex-direction: column;
            }
            
            .filters input, .filters select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- شريط التنقل -->
        <nav class="navbar">
            <div class="logo">🔐 ASSe Admin</div>
            <div class="admin-info">
                <span class="admin-badge">👑 أدمن</span>
                <span id="adminEmail" style="color: rgba(255,255,255,0.6);"></span>
                <button class="logout-btn" onclick="logout()">تسجيل خروج</button>
            </div>
        </nav>

        <!-- رسائل التنبيه -->
        <div id="alert" class="alert"></div>

        <!-- بطاقات الإحصائيات -->
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <div class="stat-number" id="totalUsers">0</div>
                <div class="stat-label">👥 إجمالي المستخدمين</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalDeposits">0</div>
                <div class="stat-label">💰 إجمالي الإيداعات</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalWithdrawals">0</div>
                <div class="stat-label">💸 إجمالي السحوبات</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalBalance">0</div>
                <div class="stat-label">💎 إجمالي الأرصدة</div>
            </div>
        </div>

        <!-- التبويبات -->
        <div class="tabs">
            <button class="tab-btn active" data-tab="users">👤 المستخدمين</button>
            <button class="tab-btn" data-tab="deposits">💰 الإيداعات</button>
            <button class="tab-btn" data-tab="withdrawals">💸 السحوبات</button>
            <button class="tab-btn" data-tab="logs">📋 السجلات</button>
        </div>

        <!-- الفلاتر -->
        <div class="filters">
            <input type="text" id="searchInput" placeholder="🔍 بحث عن مستخدم..." onkeyup="filterTable()">
            <select id="planFilter" onchange="filterTable()">
                <option value="">جميع الخطط</option>
                <option value="TRIAL">TRIAL</option>
                <option value="M1">M1</option>
                <option value="M2">M2</option>
                <option value="M3">M3</option>
                <option value="M4">M4</option>
                <option value="M5">M5</option>
                <option value="M6">M6</option>
            </select>
            <select id="statusFilter" onchange="filterTable()">
                <option value="">جميع الحالات</option>
                <option value="active">نشط</option>
                <option value="inactive">غير نشط</option>
            </select>
        </div>

        <!-- الجدول -->
        <div class="table-wrapper">
            <div id="loading" class="loading">جاري تحميل البيانات...</div>
            <div id="tableContainer" style="display: none;">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>المعرف</th>
                            <th>البريد الإلكتروني</th>
                            <th>الرصيد</th>
                            <th>الخطة</th>
                            <th>المحفظة</th>
                            <th>المهام</th>
                            <th>الحالة</th>
                            <th>تاريخ التسجيل</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <script>
        // 🔧 إعدادات Firebase (نفس البيانات المستخرجة)
        const firebaseConfig = {
            apiKey: "AIzaSyAuOzU5mZYMwyycNCgWiLp6FsmNG1eVPZ0",
            authDomain: "asse-platform.firebaseapp.com",
            projectId: "asse-platform",
            storageBucket: "asse-platform.firebasestorage.app",
            messagingSenderId: "484369667287",
            appId: "1:484369667287:web:de86db90e76a0413e94c92",
            measurementId: "G-DYWPCCKM23"
        };

        // تهيئة Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // متغيرات عامة
        let allUsers = [];
        let allDeposits = [];
        let allWithdrawals = [];
        let currentTab = 'users';

        // ============================================
        // 🔐 المصادقة والتحقق من صلاحية الأدمن
        // ============================================
        
        // التحقق من حالة المصادقة
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                // التحقق من أن المستخدم أدمن عبر Custom Claims
                const token = await user.getIdTokenResult();
                if (token.claims.admin === true) {
                    // ✅ مستخدم أدمن موثوق
                    document.getElementById('adminEmail').textContent = user.email;
                    loadData();
                } else {
                    // ❌ مستخدم عادي يحاول الدخول
                    showAlert('⚠️ غير مصرح لك بالدخول إلى لوحة التحكم', 'danger');
                    setTimeout(() => auth.signOut(), 2000);
                }
            } else {
                // 🔒 غير مسجل الدخول - توجيه لتسجيل الدخول
                showAlert('🔒 يرجى تسجيل الدخول كأدمن أولاً', 'danger');
                // نافذة تسجيل دخول مبسطة
                showLoginPopup();
            }
        });

        // نافذة تسجيل الدخول
        function showLoginPopup() {
            const email = prompt('📧 البريد الإلكتروني للأدمن:');
            if (!email) return;
            
            const password = prompt('🔑 كلمة المرور:');
            if (!password) return;
            
            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    showAlert('✅ تم تسجيل الدخول بنجاح', 'success');
                })
                .catch((error) => {
                    showAlert('❌ خطأ في تسجيل الدخول: ' + error.message, 'danger');
                    setTimeout(showLoginPopup, 1000);
                });
        }

        // تسجيل الخروج
        function logout() {
            auth.signOut().then(() => {
                location.reload();
            });
        }

        // ============================================
        // 📊 تحميل البيانات وعرضها
        // ============================================
        
        async function loadData() {
            try {
                showLoading(true);
                
                // تحميل المستخدمين
                const usersSnap = await db.collection('users').get();
                allUsers = [];
                usersSnap.forEach(doc => {
                    const data = doc.data();
                    allUsers.push({
                        id: doc.id,
                        ...data,
                        registeredAt: data.registeredAt?.toDate?.() || new Date()
                    });
                });

                // تحميل الإيداعات
                const depositsSnap = await db.collection('settings/recharges').get();
                allDeposits = [];
                depositsSnap.forEach(doc => {
                    allDeposits.push({ id: doc.id, ...doc.data() });
                });

                // تحميل السحوبات
                const withdrawalsSnap = await db.collection('settings/withdrawals').get();
                allWithdrawals = [];
                withdrawalsSnap.forEach(doc => {
                    allWithdrawals.push({ id: doc.id, ...doc.data() });
                });

                // تحديث الإحصائيات
                updateStats();
                
                // عرض البيانات حسب التبويب النشط
                renderCurrentTab();
                
                showLoading(false);
                document.getElementById('tableContainer').style.display = 'block';
                
            } catch (error) {
                console.error('خطأ في تحميل البيانات:', error);
                showAlert('❌ خطأ في تحميل البيانات: ' + error.message, 'danger');
                showLoading(false);
            }
        }

        // تحديث الإحصائيات
        function updateStats() {
            document.getElementById('totalUsers').textContent = allUsers.length;
            
            let totalDeposits = 0;
            let totalWithdrawals = 0;
            let totalBalance = 0;
            
            allUsers.forEach(user => {
                totalBalance += (user.bal || 0);
                if (user.deposits) {
                    user.deposits.forEach(d => {
                        totalDeposits += (d.amount || 0);
                    });
                }
                if (user.withdrawals) {
                    user.withdrawals.forEach(w => {
                        totalWithdrawals += (w.amount || 0);
                    });
                }
            });
            
            document.getElementById('totalDeposits').textContent = totalDeposits.toFixed(2);
            document.getElementById('totalWithdrawals').textContent = totalWithdrawals.toFixed(2);
            document.getElementById('totalBalance').textContent = totalBalance.toFixed(2);
        }

        // عرض التبويب الحالي
        function renderCurrentTab() {
            if (currentTab === 'users') {
                renderUsersTable();
            } else if (currentTab === 'deposits') {
                renderDepositsTable();
            } else if (currentTab === 'withdrawals') {
                renderWithdrawalsTable();
            } else if (currentTab === 'logs') {
                renderLogsTable();
            }
        }

        // ============================================
        // 👤 عرض جدول المستخدمين
        // ============================================
        
        function renderUsersTable() {
            const tbody = document.getElementById('tableBody');
            const search = document.getElementById('searchInput').value.toLowerCase();
            const planFilter = document.getElementById('planFilter').value;
            const statusFilter = document.getElementById('statusFilter').value;
            
            let filtered = allUsers.filter(user => {
                const matchSearch = user.id.toLowerCase().includes(search) || 
                                   (user.email || '').toLowerCase().includes(search);
                const matchPlan = !planFilter || (user.plan || '').toUpperCase() === planFilter;
                const matchStatus = !statusFilter || 
                    (statusFilter === 'active' ? (user.bal > 0) : (user.bal <= 0));
                return matchSearch && matchPlan && matchStatus;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);">
                    📭 لا توجد بيانات مطابقة
                </td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map((user, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td style="font-family:monospace;font-size:12px;color:#f093fb;">${user.id.slice(0, 12)}...</td>
                    <td>${user.email || 'غير محدد'}</td>
                    <td style="color:#2ed573;font-weight:600;">${(user.bal || 0).toFixed(2)}</td>
                    <td><span class="status-badge status-${user.plan ? 'active' : 'inactive'}">${user.plan || 'TRIAL'}</span></td>
                    <td style="font-family:monospace;font-size:11px;color:rgba(255,255,255,0.5);">${(user.walletAddr || 'غير محدد').slice(0, 10)}...</td>
                    <td>${user.tasksDone || 0}/${user.dailyTasks || 0}</td>
                    <td><span class="status-badge ${(user.bal > 0) ? 'status-active' : 'status-inactive'}">
                        ${(user.bal > 0) ? '✅ نشط' : '⛔ غير نشط'}
                    </span></td>
                    <td style="font-size:12px;color:rgba(255,255,255,0.4);">${formatDate(user.registeredAt)}</td>
                </tr>
            `).join('');
        }

        // ============================================
        // 💰 عرض جدول الإيداعات
        // ============================================
        
        function renderDepositsTable() {
            const tbody = document.getElementById('tableBody');
            
            if (allDeposits.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);">
                    📭 لا توجد إيداعات مسجلة
                </td></tr>`;
                return;
            }

            tbody.innerHTML = allDeposits.map((deposit, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td style="font-family:monospace;font-size:12px;color:#f093fb;">${deposit.userId?.slice(0, 12) || 'غير معروف'}...</td>
                    <td style="color:#2ed573;font-weight:600;">${(deposit.amount || 0).toFixed(2)}</td>
                    <td><span class="status-badge ${deposit.status === 'completed' ? 'status-active' : 'status-pending'}">
                        ${deposit.status || 'قيد الانتظار'}
                    </span></td>
                    <td style="font-size:12px;color:rgba(255,255,255,0.4);">${formatDate(deposit.createdAt)}</td>
                </tr>
            `).join('');
        }

        // ============================================
        // 💸 عرض جدول السحوبات
        // ============================================
        
        function renderWithdrawalsTable() {
            const tbody = document.getElementById('tableBody');
            
            if (allWithdrawals.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);">
                    📭 لا توجد سحوبات مسجلة
                </td></tr>`;
                return;
            }

            tbody.innerHTML = allWithdrawals.map((withdrawal, index) => `
                <tr>
                    <td>${index + 1}</td>
                    <td style="font-family:monospace;font-size:12px;color:#f093fb;">${withdrawal.userId?.slice(0, 12) || 'غير معروف'}...</td>
                    <td style="color:#ff4757;font-weight:600;">${(withdrawal.amount || 0).toFixed(2)}</td>
                    <td><span class="status-badge ${withdrawal.status === 'completed' ? 'status-active' : 'status-pending'}">
                        ${withdrawal.status || 'قيد الانتظار'}
                    </span></td>
                    <td style="font-size:12px;color:rgba(255,255,255,0.4);">${formatDate(withdrawal.createdAt)}</td>
                </tr>
            `).join('');
        }

        // ============================================
        // 📋 عرض السجلات
        // ============================================
        
        async function renderLogsTable() {
            const tbody = document.getElementById('tableBody');
            
            try {
                const logsSnap = await db.collection('settings/logs').orderBy('timestamp', 'desc').limit(100).get();
                const logs = [];
                logsSnap.forEach(doc => logs.push({ id: doc.id, ...doc.data() }));
                
                if (logs.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:40px;color:rgba(255,255,255,0.3);">
                        📭 لا توجد سجلات
                    </td></tr>`;
                    return;
                }

                tbody.innerHTML = logs.map((log, index) => `
                    <tr>
                        <td>${index + 1}</td>
                        <td style="font-size:12px;color:rgba(255,255,255,0.5);">${log.action || 'إجراء'}</td>
                        <td style="font-family:monospace;font-size:11px;color:#f093fb;">${log.userId?.slice(0, 12) || 'نظام'}...</td>
                        <td style="font-size:12px;color:rgba(255,255,255,0.4);">${formatDate(log.timestamp)}</td>
                    </tr>
                `).join('');
                
            } catch (error) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;padding:40px;color:#ff4757;">
                    ❌ خطأ في تحميل السجلات: ${error.message}
                </td></tr>`;
            }
        }

        // ============================================
        // 🛠 أدوات مساعدة
        // ============================================
        
        function formatDate(date) {
            if (!date) return 'غير محدد';
            try {
                const d = date instanceof Date ? date : date.toDate?.() || new Date(date);
                return d.toLocaleDateString('ar-EG', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });
            } catch {
                return 'تاريخ غير صحيح';
            }
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
        }

        function showAlert(message, type) {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = 'alert alert-' + type;
            alert.style.display = 'block';
            
            if (type === 'success') {
                setTimeout(() => {
                    alert.style.display = 'none';
                }, 5000);
            }
        }

        function filterTable() {
            renderCurrentTab();
        }

        // ============================================
        // 🔄 التبويبات
        // ============================================
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentTab = this.dataset.tab;
                
                // إخفاء البحث والفلاتر لبعض التبويبات
                const filters = document.querySelector('.filters');
                if (currentTab === 'users') {
                    filters.style.display = 'flex';
                } else {
                    filters.style.display = 'none';
                }
                
                renderCurrentTab();
            });
        });

        // ============================================
        // 🚀 بدء التطبيق
        // ============================================
        
        console.log('🔐 لوحة تحكم ASSe Admin - نسخة آمنة');
        console.log('📌 تم تطويرها وفق معايير الأمان الموصى بها');
        console.log('⚠️ جميع العمليات تتم عبر Firebase Auth + Custom Claims');
    </script>
</body>
</html>
