<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>آسِ · لوحة إدارة الحسابات المرعبة</title>
    <!-- Firebase v10.12.0 compat -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background: #0a0e18; color: #e2eaff; padding: 12px; min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; }
        .card { max-width: 780px; width: 100%; background: #121b2e; border-radius: 36px; padding: 22px 20px 30px; border: 1px solid #2d3d62; box-shadow: 0 20px 40px rgba(0,0,0,0.8); margin: 10px auto; }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; margin-bottom: 6px; }
        h1 { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
        h1 small { font-size: 14px; font-weight: 400; color: #7b8fc7; }
        .badge-admin { background: #1f2a44; padding: 4px 16px; border-radius: 60px; font-size: 13px; border: 1px solid #3f5a8a; }
        .sub { color: #9aafdf; font-size: 14px; margin-bottom: 14px; border-bottom: 1px dashed #253452; padding-bottom: 12px; display: flex; justify-content: space-between; flex-wrap: wrap; }
        .unlock-area { display: flex; gap: 6px; background: #0e1629; padding: 6px 8px; border-radius: 60px; border: 1px solid #2e406a; margin-bottom: 16px; }
        .unlock-area input { flex: 1; background: transparent; border: none; padding: 10px 14px; color: #dce6ff; font-size: 15px; outline: none; }
        .unlock-area button { background: #2d4680; border: none; color: white; padding: 8px 22px; border-radius: 40px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .unlock-area button:hover { background: #3d5caa; }
        .field { margin-bottom: 14px; }
        label { display: block; font-size: 13px; font-weight: 600; color: #b2c6f5; margin-bottom: 4px; }
        input, select { width: 100%; padding: 12px 16px; background: #0d1426; border: 1px solid #26375a; border-radius: 20px; color: #f0f6ff; font-size: 15px; outline: none; transition: 0.2s; }
        input:focus, select:focus { border-color: #5f81ff; background: #0b1124; box-shadow: 0 0 0 3px #1f3b8a55; }
        .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .btn { width: 100%; padding: 14px; background: #253b70; border: none; border-radius: 60px; font-weight: 700; font-size: 15px; color: white; cursor: pointer; transition: 0.2s; box-shadow: 0 6px 12px #0b142a; }
        .btn:hover { background: #3d5bb0; transform: scale(1.01); }
        .btn:active { transform: scale(0.97); }
        .btn-success { background: #1f7a4f; }
        .btn-success:hover { background: #2a9a65; }
        .btn-danger { background: #8f2d3e; }
        .btn-danger:hover { background: #b43a50; }
        .btn-outline { background: transparent; border: 1.5px solid #3f5a8a; box-shadow: none; }
        .btn-outline:hover { background: #1f2d50; }
        .flex { display: flex; gap: 8px; flex-wrap: wrap; }
        .flex .btn { width: auto; padding: 10px 18px; font-size: 13px; }
        .output { margin-top: 20px; background: #0b1224; border-radius: 24px; padding: 16px; border: 1px solid #22335a; }
        .output h3 { font-size: 15px; color: #a7beff; display: flex; gap: 10px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
        .pre-wrap { background: #070c1a; padding: 14px; border-radius: 18px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: #c8d8ff; max-height: 300px; overflow-y: auto; border: 1px solid #1b2a4a; font-family: 'Courier New', monospace; }
        .pre-wrap .user-item { border-bottom: 1px solid #1f2d4a; padding: 6px 0; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .pre-wrap .user-item .uid { color: #8a9fd6; font-size: 12px; }
        .pre-wrap .user-item .name { color: #ffb07c; font-weight: bold; }
        .pre-wrap .user-item .phone { color: #7fb0ff; }
        .pre-wrap .user-item .bal { color: #6fcf97; }
        .copy-btn { background: #263a62; border: none; color: #c2d4ff; padding: 6px 18px; border-radius: 40px; font-size: 13px; cursor: pointer; transition: 0.2s; }
        .copy-btn:hover { background: #3a5290; }
        .del-btn { background: #6e2433; border: none; color: #ffb0b0; padding: 3px 12px; border-radius: 40px; font-size: 12px; cursor: pointer; transition: 0.2s; margin-left: 6px; }
        .del-btn:hover { background: #a0354a; }
        .alert { background: #8f2d3e30; border-right: 4px solid #e65a6a; padding: 10px 16px; border-radius: 16px; margin-bottom: 14px; font-size: 13px; color: #f0baba; }
        .footnote { margin-top: 16px; font-size: 12px; color: #62749e; text-align: center; border-top: 1px solid #1c2945; padding-top: 14px; }
        .badge-count { background: #1a2645; padding: 2px 14px; border-radius: 40px; font-size: 13px; }
        .loading { opacity: 0.6; pointer-events: none; }
        .confirm-box { background: #1e2a48; border-radius: 16px; padding: 12px; margin: 8px 0; border: 1px solid #4a5f8a; }
        .confirm-box .flex { gap: 6px; }
        .confirm-box .btn { font-size: 13px; padding: 8px 16px; }
    </style>
</head>
<body>
<div class="card" id="app">
    <div class="header">
        <h1>👻 <span>آسِ</span><small>· إدارة الحسابات</small></h1>
        <span class="badge-admin">⚡ أدمن</span>
    </div>
    <div class="sub">
        <span id="currentUserDisplay">🔒 غير مصادق</span>
        <span style="color:#7f94c9;">🔑 admin/db2024admin</span>
    </div>

    <div class="alert">⚠️ بيانات الأدمن مضمّنة · تحكم كامل بالحسابات (عرض، حذف فردي، حذف شامل)</div>

    <!-- قفل الأدمن -->
    <div class="unlock-area">
        <input type="password" id="adminPassInput" placeholder="كلمة مرور الأدمن">
        <button id="unlockBtn">🔓 فتح</button>
    </div>

    <!-- قسم العرض والحذف -->
    <div style="margin-top: 6px;">
        <div class="flex" style="margin-bottom: 10px;">
            <button id="showUsersBtn" class="btn btn-success" style="flex:1;">📋 عرض جميع الحسابات</button>
            <button id="deleteAllBtn" class="btn btn-danger" style="flex:1;">🔥 حذف الكل</button>
        </div>
        <div id="deleteSingleArea" style="display: flex; gap: 6px; background: #0e1629; padding: 6px 8px; border-radius: 60px; border: 1px solid #2e406a; margin-bottom: 10px;">
            <input type="text" id="deleteSingleInput" placeholder="UID أو الهاتف للحذف الفردي" style="flex:1; background:transparent; border:none; padding:8px 12px; color:#dce6ff; outline:none;">
            <button id="deleteSingleBtn" class="btn btn-danger" style="width:auto; padding:6px 20px; font-size:13px;">🗑️ حذف</button>
        </div>
    </div>

    <!-- نموذج إنشاء سريع (مدمج) -->
    <div style="background: #0e1629; border-radius: 24px; padding: 16px; margin: 12px 0; border: 1px solid #22335a;">
        <div class="row2">
            <div class="field" style="margin-bottom: 8px;">
                <label>👤 الاسم</label>
                <input type="text" id="nameInput" placeholder="اسم مرعب" value="Shadow_Wraith">
            </div>
            <div class="field" style="margin-bottom: 8px;">
                <label>📱 الهاتف</label>
                <input type="text" id="phoneInput" placeholder="9665..." value="966512345678">
            </div>
        </div>
        <div class="row2">
            <div class="field" style="margin-bottom: 8px;">
                <label>🔑 كلمة المرور</label>
                <input type="text" id="passInput" placeholder="********" value="DarkPass2026!">
            </div>
            <div class="field" style="margin-bottom: 8px;">
                <label>💰 الرصيد $</label>
                <input type="number" id="balanceInput" value="0">
            </div>
        </div>
        <div class="flex">
            <button id="createUserBtn" class="btn btn-success" style="flex:2;">➕ إنشاء حساب</button>
            <button id="randomScaryBtn" class="btn btn-outline" style="flex:1;">👻 اسم مرعب</button>
        </div>
    </div>

    <!-- المخرجات (عرض الحسابات) -->
    <div class="output">
        <h3>📜 <span>قائمة الحسابات</span> 
            <span id="usersCount" class="badge-count">0</span>
            <span style="margin-right: auto; font-size: 11px; background: #18223f; padding: 2px 14px; border-radius: 40px;">آخر تحديث</span>
        </h3>
        <div id="resultArea" class="pre-wrap">🔮 اضغط "عرض جميع الحسابات" ...</div>
        <div class="flex" style="margin-top: 10px;">
            <button id="copyResultBtn" class="copy-btn">📄 نسخ</button>
            <button id="clearResultBtn" class="copy-btn">🧹 مسح</button>
            <button id="refreshUsersBtn" class="copy-btn">🔄 تحديث</button>
        </div>
    </div>

    <div class="footnote">
        🧛 عرض، حذف فردي (بالـUID أو الهاتف)، حذف شامل مع تأكيد · جميع العمليات تسجل في logs.
    </div>
</div>
<script>
    (function() {
        // ---------- Firebase Config ----------
        const firebaseConfig = {
            apiKey: "AIzaSyBSqx1BR2nf16PTJ5h7POC7ccYByPJtP6M",
            authDomain: "asse-app-16998.firebaseapp.com",
            projectId: "asse-app-16998",
            storageBucket: "asse-app-16998.firebasestorage.app",
            messagingSenderId: "835771799328",
            appId: "1:835771799328:web:b587a5da0cb129c2042945",
            measurementId: "G-DJR968QCWK"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // ---------- بيانات الأدمن ----------
        const ADMIN_CRED = { username: 'admin', password: 'db2024admin' };
        let adminUnlocked = false;
        let currentUsers = [];

        // عناصر DOM
        const phoneInp = document.getElementById('phoneInput');
        const nameInp = document.getElementById('nameInput');
        const passInp = document.getElementById('passInput');
        const balanceInp = document.getElementById('balanceInput');
        const createBtn = document.getElementById('createUserBtn');
        const resultArea = document.getElementById('resultArea');
        const unlockBtn = document.getElementById('unlockBtn');
        const adminPassInput = document.getElementById('adminPassInput');
        const currentUserDisplay = document.getElementById('currentUserDisplay');
        const randomScaryBtn = document.getElementById('randomScaryBtn');
        const showUsersBtn = document.getElementById('showUsersBtn');
        const deleteAllBtn = document.getElementById('deleteAllBtn');
        const deleteSingleBtn = document.getElementById('deleteSingleBtn');
        const deleteSingleInput = document.getElementById('deleteSingleInput');
        const copyResultBtn = document.getElementById('copyResultBtn');
        const clearResultBtn = document.getElementById('clearResultBtn');
        const refreshUsersBtn = document.getElementById('refreshUsersBtn');
        const usersCountSpan = document.getElementById('usersCount');

        // ---------- قائمة أسماء مرعبة ----------
        const SCARY_NAMES = [
            "Shadow_Wraith", "Nightmare_Reaper", "Dark_Soul", "Crimson_Phantom",
            "Void_Walker", "Blood_King", "Frost_Doom", "Ashen_One", "Dread_Lord",
            "Silent_Stalker", "Grim_Harbinger", "Nether_Spawn", "Abyss_Guardian",
            "Wraith_King", "Sorrow_Eater", "Phantom_Reaper", "Doom_Bringer",
            "Dark_Prophet", "Shadow_Revenant", "Cursed_Blade", "Eternal_Night",
            "Soul_Thief", "Gloom_Walker", "Raven_Death", "Scarlet_Doom",
            "Fury_Shadow", "Dusk_Tyrant", "Bane_Of_Light", "Mourning_Star",
            "Vengeance_Spirit", "Crypt_Keeper", "Necro_Warlock", "Blight_Reaper"
        ];

        // ---------- دوال مساعدة ----------
        function getRandomScaryName() { return SCARY_NAMES[Math.floor(Math.random() * SCARY_NAMES.length)]; }
        function getRandomPhone() { return '9665' + String(Math.floor(Math.random() * 90000000 + 10000000)).slice(0, 8); }
        function getRandomPass() {
            const words = ['Dark', 'Shadow', 'Night', 'Crimson', 'Void', 'Frost', 'Dread', 'Grim', 'Nether', 'Abyss'];
            return words[Math.floor(Math.random() * words.length)] + String(Math.floor(Math.random() * 9000 + 1000)) + ['!','@','#','$','&'][Math.floor(Math.random()*5)];
        }
        function getRandomRefCode() { return 'DB' + String(Math.floor(Math.random() * 90000 + 10000)); }

        function logToResult(msg, isError = false) {
            const prefix = isError ? '❌ ' : '✅ ';
            const lines = resultArea.innerHTML.split('\n');
            lines.unshift(prefix + msg);
            if (lines.length > 60) lines.pop();
            resultArea.innerHTML = lines.join('\n');
        }

        function setResult(msg) { resultArea.innerHTML = msg; }

        function updateUserDisplay() {
            const user = auth.currentUser;
            currentUserDisplay.textContent = user ? '👤 ' + (user.email || user.uid) : '🔒 غير مصادق';
        }
        auth.onAuthStateChanged(updateUserDisplay);
        updateUserDisplay();

        // فتح الأدمن
        function attemptAdminUnlock() {
            if (adminPassInput.value.trim() === ADMIN_CRED.password) {
                adminUnlocked = true;
                logToResult('🔓 تم فتح صلاحيات الأدمن');
                adminPassInput.value = '';
                adminPassInput.placeholder = '✅ مفعل';
                adminPassInput.style.borderColor = '#3ca85a';
                return true;
            } else {
                adminUnlocked = false;
                logToResult('❌ كلمة مرور الأدمن غير صحيحة', true);
                adminPassInput.style.borderColor = '#c73d3d';
                return false;
            }
        }
        unlockBtn.addEventListener('click', attemptAdminUnlock);
        adminPassInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') attemptAdminUnlock(); });

        function isAdminAuthorized() {
            if (!adminUnlocked) {
                logToResult('⛔ يجب فتح قفل الأدمن أولاً', true);
                return false;
            }
            return true;
        }

        // ---------- عرض جميع المستخدمين ----------
        async function fetchAllUsers() {
            if (!isAdminAuthorized()) return;
            try {
                const snapshot = await db.collection('users').get();
                const users = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    users.push({
                        uid: doc.id,
                        name: data.name || 'مجهول',
                        phone: data.phone || '---',
                        balance: data.bal || 0,
                        plan: data.plan || 'S1',
                        refCode: data.refCode || '---',
                        joined: data.joined || '---'
                    });
                });
                currentUsers = users;
                return users;
            } catch (error) {
                logToResult('❌ فشل جلب المستخدمين: ' + error.message, true);
                return [];
            }
        }

        async function displayUsers() {
            const users = await fetchAllUsers();
            if (users.length === 0) {
                setResult('📭 لا توجد حسابات مسجلة.');
                usersCountSpan.textContent = '0';
                return;
            }
            let html = `👥 إجمالي المستخدمين: ${users.length}\n${'═'.repeat(40)}\n`;
            users.forEach((u, idx) => {
                html += `${idx+1}. ${u.name} | 📱${u.phone} | 💰$${u.balance} | 📋${u.plan} | 🆔${u.uid.slice(0,12)}...\n`;
            });
            setResult(html);
            usersCountSpan.textContent = users.length;
            logToResult(`📋 تم عرض ${users.length} حسابات`);
        }

        showUsersBtn.addEventListener('click', displayUsers);
        refreshUsersBtn.addEventListener('click', displayUsers);

        // ---------- حذف فردي ----------
        async function deleteSingleUser(identifier) {
            if (!isAdminAuthorized()) return false;
            if (!identifier || identifier.trim() === '') {
                logToResult('⚠️ أدخل UID أو رقم الهاتف', true);
                return false;
            }
            identifier = identifier.trim();
            try {
                // البحث عن المستند
                let docId = null;
                // حاول كـ UID أولاً
                const docRef = db.collection('users').doc(identifier);
                const docSnap = await docRef.get();
                if (docSnap.exists) {
                    docId = identifier;
                } else {
                    // بحث بالهاتف
                    const snapshot = await db.collection('users').where('phone', '==', identifier).get();
                    if (!snapshot.empty) {
                        docId = snapshot.docs[0].id;
                    } else {
                        logToResult(`❌ لم يتم العثور على مستخدم بـ "${identifier}"`, true);
                        return false;
                    }
                }

                // حذف من Auth (إذا كان البريد موجود)
                try {
                    const userRecord = await auth.getUser(docId);
                    if (userRecord) await auth.deleteUser(docId);
                } catch (e) { /* قد لا يكون موجوداً في Auth */ }

                // حذف من Firestore
                await db.collection('users').doc(docId).delete();

                // تسجيل في logs
                await db.collection('settings').doc('logs').set({
                    entries: firebase.firestore.FieldValue.arrayUnion({
                        action: 'delete_user',
                        by: 'admin_console',
                        target: docId,
                        identifier: identifier,
                        timestamp: new Date().toISOString()
                    })
                }, { merge: true });

                logToResult(`🗑️ تم حذف المستخدم ${docId} (${identifier})`);
                await displayUsers(); // تحديث القائمة
                return true;
            } catch (error) {
                logToResult(`❌ فشل الحذف: ${error.message}`, true);
                return false;
            }
        }

        deleteSingleBtn.addEventListener('click', async () => {
            const val = deleteSingleInput.value.trim();
            if (val) {
                await deleteSingleUser(val);
                deleteSingleInput.value = '';
            } else {
                logToResult('⚠️ أدخل UID أو رقم الهاتف', true);
            }
        });

        deleteSingleInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                deleteSingleBtn.click();
            }
        });

        // ---------- حذف الكل (مع تأكيد) ----------
        async function deleteAllUsers() {
            if (!isAdminAuthorized()) return;
            if (!confirm('🔥 هل أنت متأكد من حذف جميع الحسابات؟ هذا الإجراء لا يمكن التراجع عنه!')) {
                logToResult('❌ تم إلغاء عملية الحذف الشامل');
                return;
            }
            const confirm2 = prompt('اكتب "حذف الكل" لتأكيد الحذف الشامل:');
            if (confirm2 !== 'حذف الكل') {
                logToResult('❌ تم إلغاء الحذف (التأكيد غير صحيح)');
                return;
            }

            try {
                const snapshot = await db.collection('users').get();
                if (snapshot.empty) {
                    logToResult('📭 لا توجد حسابات للحذف');
                    return;
                }

                let deletedCount = 0;
                const batch = db.batch();
                const allIds = [];

                snapshot.forEach(doc => {
                    batch.delete(doc.ref);
                    allIds.push(doc.id);
                    deletedCount++;
                    // حذف من Auth (محاولة)
                    try {
                        auth.getUser(doc.id).then(user => {
                            if (user) auth.deleteUser(doc.id);
                        }).catch(() => {});
                    } catch (e) {}
                });

                await batch.commit();

                // تسجيل في logs
                await db.collection('settings').doc('logs').set({
                    entries: firebase.firestore.FieldValue.arrayUnion({
                        action: 'delete_all_users',
                        by: 'admin_console',
                        count: deletedCount,
                        timestamp: new Date().toISOString()
                    })
                }, { merge: true });

                logToResult(`🔥 تم حذف ${deletedCount} حساباً بنجاح`);
                setResult(`🔥 تم حذف جميع الحسابات (${deletedCount})`);
                usersCountSpan.textContent = '0';
                currentUsers = [];
                await displayUsers();
            } catch (error) {
                logToResult(`❌ فشل الحذف الشامل: ${error.message}`, true);
            }
        }

        deleteAllBtn.addEventListener('click', deleteAllUsers);

        // ---------- إنشاء حساب (مدمج) ----------
        async function createUserDocument(uid, phone, name, pass, balance, plan, refCode) {
            if (!uid) throw new Error('UID مطلوب');
            const userData = {
                phone: phone,
                id: uid,
                name: name,
                pass: pass,
                txPass: '',
                bal: parseFloat(balance) || 0,
                totalEarned: 0,
                refBonus: 0,
                workDays: 0,
                plan: plan || 'S1',
                tasksDone: 0,
                lastTaskDate: new Date().toISOString().split('T')[0],
                lastIncDate: new Date().toISOString().split('T')[0],
                deposits: [],
                withdrawals: [],
                planPurchased: false,
                walletAddr: '',
                refCode: refCode || getRandomRefCode(),
                refs: [],
                joined: new Date().toISOString(),
                lockedFunds: 0,
                teamCommission: 0,
                teamCommToday: 0,
                refBy: ''
            };
            await db.collection('users').doc(uid).set(userData);
            await db.collection('settings').doc('logs').set({
                entries: firebase.firestore.FieldValue.arrayUnion({
                    action: 'create_user',
                    by: 'admin_console',
                    target: uid,
                    phone: phone,
                    timestamp: new Date().toISOString(),
                    details: { name, plan, balance }
                })
            }, { merge: true });
            return userData;
        }

        async function createSingleUser(phone, name, pass, balance, plan, refCode) {
            if (!isAdminAuthorized()) return null;
            try {
                const email = phone + '@asse-app.tmp';
                const userCred = await auth.createUserWithEmailAndPassword(email, pass);
                const uid = userCred.user.uid;
                const userData = await createUserDocument(uid, phone, name, pass, balance, plan, refCode);
                return { uid, userData, success: true };
            } catch (error) {
                console.error(error);
                throw error;
            }
        }

        async function handleCreateUser() {
            if (!isAdminAuthorized()) return;
            let name = nameInp.value.trim() || getRandomScaryName();
            const phone = phoneInp.value.trim() || getRandomPhone();
            const pass = passInp.value.trim() || getRandomPass();
            const balance = parseFloat(balanceInp.value) || 0;
            const plan = 'S1';
            const refCode = getRandomRefCode();

            if (phone.length < 8) { logToResult('⚠️ رقم الهاتف قصير', true); return; }
            if (pass.length < 6) { logToResult('⚠️ كلمة المرور ضعيفة', true); return; }

            try {
                const result = await createSingleUser(phone, name, pass, balance, plan, refCode);
                if (result) {
                    logToResult(`✅ تم إنشاء ${name} (${phone})`);
                    await displayUsers();
                    // تنظيف
                    phoneInp.value = '';
                    nameInp.value = '';
                    passInp.value = '';
                    balanceInp.value = '0';
                }
            } catch (error) {
                let msg = error.message;
                if (error.code === 'auth/email-already-in-use') msg = 'الهاتف مستخدم مسبقاً';
                logToResult(`❌ فشل: ${msg}`, true);
            }
        }

        createBtn.addEventListener('click', handleCreateUser);

        // اسم مرعب عشوائي
        randomScaryBtn.addEventListener('click', () => {
            nameInp.value = getRandomScaryName();
            logToResult(`👻 تم اختيار اسم: ${nameInp.value}`);
        });

        // ---------- نسخ ومسح ----------
        copyResultBtn.addEventListener('click', () => {
            const text = resultArea.innerText || resultArea.textContent;
            if (text && text.length > 5) {
                navigator.clipboard?.writeText(text).catch(() => {
                    const range = document.createRange();
                    range.selectNode(resultArea);
                    window.getSelection().removeAllRanges();
                    window.getSelection().addRange(range);
                    document.execCommand('copy');
                });
                logToResult('📋 تم النسخ');
            }
        });

        clearResultBtn.addEventListener('click', () => setResult('🧹 تم المسح'));

        // بداية
        setResult('👻 قم بفتح قفل الأدمن ثم استخدم الأزرار لعرض أو حذف الحسابات.');
        console.log('🔑 Admin: admin / db2024admin · لوحة إدارة الحسابات جاهزة.');
    })();
</script>
</body>
</html>
