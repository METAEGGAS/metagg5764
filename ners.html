<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>Asse Users Dump</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,'Segoe UI',Tahoma,Arial,sans-serif}body{background:#0b1020;color:#e6e9f2;padding:10px;font-size:13px}h1{font-size:17px;margin-bottom:6px;color:#7ee8fa}h2{font-size:14px;margin:8px 0 4px;color:#ffcc70}.bar{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;align-items:center}button,input,select{background:#182046;color:#e6e9f2;border:1px solid #2a3570;border-radius:5px;padding:5px 9px;font-size:12px;cursor:pointer}button:hover{background:#25306b}input{min-width:160px}.tabs{display:flex;flex-wrap:wrap;gap:3px;border-bottom:1px solid #2a3570;margin-bottom:6px}.tab{padding:5px 10px;background:#151a35;border-radius:5px 5px 0 0;cursor:pointer;border:1px solid #2a3570;border-bottom:none;font-size:11px}.tab.active{background:#2a3570;color:#7ee8fa;font-weight:700}.status{padding:6px;background:#151a35;border-radius:5px;margin-bottom:6px;font-family:monospace;font-size:10px;max-height:100px;overflow:auto;white-space:pre-wrap;border:1px solid #2a3570}.wrap{overflow:auto;max-height:72vh;border:1px solid #2a3570;border-radius:5px;background:#0f1330}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #232a55;padding:4px 6px;text-align:right;vertical-align:top;max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}th{background:#1c2450;position:sticky;top:0;color:#7ee8fa;cursor:pointer;z-index:2;font-size:10px}tr:nth-child(even) td{background:#131836}tr:hover td{background:#25306b}td.mono{font-family:monospace;color:#9fe870;font-size:10px}td.num{color:#ffcc70;font-weight:700;text-align:left;font-family:monospace}td.email{color:#7ee8fa}td.pwd{color:#ff7b7b;font-family:monospace}td.expand{white-space:normal;word-break:break-all;max-width:350px}.badge{display:inline-block;padding:1px 5px;border-radius:8px;font-size:9px;font-weight:700}.b-ok{background:#0f5132;color:#a3f7bf}.b-bad{background:#5c1a1a;color:#ffb3b3}.b-warn{background:#664d03;color:#ffe08a}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:5px;margin-bottom:6px}.stat{background:#151a35;padding:6px 8px;border-radius:5px;border:1px solid #2a3570}.stat b{display:block;font-size:15px;color:#7ee8fa}.stat span{font-size:9px;color:#8891b8}details{background:#151a35;padding:5px;border-radius:5px;margin:3px 0;border:1px solid #2a3570}summary{cursor:pointer;font-size:11px;color:#ffcc70}pre{background:#0a0e22;color:#9fe870;padding:6px;border-radius:5px;font-size:10px;overflow:auto;max-height:350px;white-space:pre-wrap;word-break:break-all;margin-top:5px}.hide{display:none}.warn{background:#5c1a1a;padding:5px 8px;border-radius:5px;color:#ffb3b3;font-size:11px;margin-bottom:6px}.info{background:#0f2a4d;padding:5px 8px;border-radius:5px;color:#7ee8fa;font-size:11px;margin-bottom:6px}</style></head><body>
<h1>🔥 Asse.blog — Users / Deposits / Withdrawals Live Dump</h1>
<div class="info">📡 يقرأ مباشرةً من <b>Firestore REST</b> — Project: <b>asse-app-16998</b> | يعرض كل المستخدمين وأرصدتهم وإيداعاتهم وسحوباتهم</div>
<div class="bar">
<button onclick="loadAll()">🔄 تحميل الكل</button>
<button onclick="loadUsersDoc()">👥 users فقط</button>
<button onclick="loadSettingsUsers()">📦 settings/users</button>
<select id="col"><option value="users">users</option><option value="withdrawals">withdrawals</option><option value="deposits">deposits</option><option value="records">records</option><option value="wd">wd</option><option value="rc">rc</option><option value="logs">logs</option><option value="tasks">tasks</option><option value="referrals">referrals</option><option value="admins">admins</option></select>
<button onclick="loadOne()">📥 مجموعة</button>
<input id="custom" placeholder="مجموعة مخصصة"><button onclick="addCustom()">+</button>
<input id="q" placeholder="🔎 بحث في الجدول..." oninput="filter()">
<button onclick="exp('json')">⬇ JSON</button><button onclick="exp('csv')">⬇ CSV</button>
</div>
<div id="stats" class="stats"></div>
<div id="status" class="status">جاهز... اضغط "تحميل الكل" لبدء الاستخراج.</div>
<div id="tabs" class="tabs"></div>
<div id="views"></div>
<script>
const CFG={apiKey:"AIzaSyBSqx1BR2nf16PTJ5h7POC7ccYByPJtP6M",projectId:"asse-app-16998"};
const BASE=`https://firestore.googleapis.com/v1/projects/${CFG.projectId}/databases/(default)/documents`;
let COLS=["users","withdrawals","deposits","records","wd","rc","logs","tasks","referrals","admins"];
const PRIO=["_id","uid","id","email","username","name","phone","password","pwd","balance","bal","deposit","deposited","totalDeposit","withdraw","withdrawn","totalWithdraw","earnings","earned","profit","ref","refCode","refBy","referredBy","referrer","level","plan","status","network","address","wallet","txid","amount","createdAt","created","joinDate","lastLogin","_createTime","_updateTime","_path"];
const DATA={};let ACTIVE=null;
const $=id=>document.getElementById(id);
function log(m,t="info"){const c={info:"#7ee8fa",ok:"#9fe870",err:"#ff7b7b",warn:"#ffcc70"}[t];$("status").innerHTML+=`\n<span style="color:${c}">[${new Date().toLocaleTimeString()}] ${m}</span>`;$("status").scrollTop=$("status").scrollHeight;}
function unwrap(v){if(v==null)return null;if("stringValue"in v)return v.stringValue;if("integerValue"in v)return +v.integerValue;if("doubleValue"in v)return +v.doubleValue;if("booleanValue"in v)return v.booleanValue;if("timestampValue"in v)return v.timestampValue;if("nullValue"in v)return null;if("arrayValue"in v)return(v.arrayValue.values||[]).map(unwrap);if("mapValue"in v)return unwrapFields(v.mapValue.fields||{});if("referenceValue"in v)return v.referenceValue;return v;}
function unwrapFields(f){const o={};for(const k in f)o[k]=unwrap(f[k]);return o;}
async function fetchCol(name){const out=[];let token=null,page=0;do{const u=new URL(`${BASE}/${name}`);u.searchParams.set("key",CFG.apiKey);u.searchParams.set("pageSize","300");if(token)u.searchParams.set("pageToken",token);const r=await fetch(u);if(!r.ok){const t=await r.text();throw new Error(`HTTP ${r.status}: ${t.slice(0,180)}`);}const j=await r.json();(j.documents||[]).forEach(d=>{const id=d.name.split("/").pop();out.push({_id:id,_path:d.name.replace(BASE+"/",""),_createTime:d.createTime,_updateTime:d.updateTime,...unwrapFields(d.fields||{})});});token=j.nextPageToken;page++;if(page>50)break;}while(token);return out;}
async function fetchDoc(path){const u=new URL(`${BASE}/${path}`);u.searchParams.set("key",CFG.apiKey);const r=await fetch(u);if(!r.ok){const t=await r.text();throw new Error(`HTTP ${r.status}: ${t.slice(0,180)}`);}const j=await r.json();return{_id:j.name.split("/").pop(),_path:path,_createTime:j.createTime,_updateTime:j.updateTime,...unwrapFields(j.fields||{})};}
async function loadOne(){const c=$("col").value;await pullCol(c);render();}
async function loadUsersDoc(){$("status").innerHTML="";await pullCol("users");render();}
async function loadSettingsUsers(){$("status").innerHTML="";log("→ settings/users (وثيقة كل المستخدمين المدمجة)");try{const doc=await fetchDoc("settings/users");const rows=[];for(const k in doc){if(k.startsWith("_"))continue;const v=doc[k];if(v&&typeof v==="object"&&!Array.isArray(v)){rows.push({_id:k,...v});}}if(!rows.length){for(const k in doc){if(!k.startsWith("_"))rows.push({_id:k,value:doc[k]});}}DATA["settings/users"]=rows;log(`   ✓ ${rows.length} مستخدم مستخرَج من settings/users`,"ok");}catch(e){DATA["settings/users"]={_err:e.message};log(`   ✗ ${e.message}`,"err");}render();}
async function loadAll(){$("status").innerHTML="";log("بدء الاستخراج الشامل من "+CFG.projectId);log("→ settings/users (الوثيقة المدمجة)");try{const doc=await fetchDoc("settings/users");const rows=[];for(const k in doc){if(k.startsWith("_"))continue;const v=doc[k];if(v&&typeof v==="object"&&!Array.isArray(v))rows.push({_id:k,...v});else rows.push({_id:k,value:v});}DATA["settings/users"]=rows;log(`   ✓ settings/users: ${rows.length} مستخدم`,"ok");}catch(e){DATA["settings/users"]={_err:e.message};log(`   ✗ settings/users: ${e.message}`,"err");}for(const c of COLS)await pullCol(c);render();log("✅ اكتمل الاستخراج","ok");}
async function pullCol(name){try{log("→ "+name);const rows=await fetchCol(name);DATA[name]=rows;log(`   ✓ ${name}: ${rows.length} وثيقة`,"ok");}catch(e){DATA[name]={_err:e.message};log(`   ✗ ${name}: ${e.message.slice(0,80)}`,"err");}}
function addCustom(){const v=$("custom").value.trim();if(v&&!COLS.includes(v)){COLS.push(v);const o=document.createElement("option");o.value=v;o.text=v;$("col").appendChild(o);log("+ "+v,"warn");}}
function orderKeys(rows){const all=new Set();rows.forEach(r=>Object.keys(r).forEach(k=>all.add(k)));const ordered=[];PRIO.forEach(k=>{if(all.has(k)){ordered.push(k);all.delete(k);}});return[...ordered,...[...all].sort()];}
function fmt(k,v){if(v==null)return{v:"",cls:""};if(typeof v==="object"){return{v:JSON.stringify(v),cls:"expand mono"};}if(typeof v==="boolean")return{v:v?'<span class="badge b-ok">✓</span>':'<span class="badge b-bad">✗</span>',cls:""};const kl=k.toLowerCase();if(typeof v==="number"||(typeof v==="string"&&/^-?\d+\.?\d*$/.test(v)&&(kl.includes("bal")||kl.includes("deposit")||kl.includes("withdraw")||kl.includes("earn")||kl.includes("amount")||kl.includes("profit")))){return{v:(+v).toLocaleString(undefined,{maximumFractionDigits:4}),cls:"num"};}if(kl==="email")return{v,cls:"email"};if(kl==="password"||kl==="pwd")return{v,cls:"pwd"};if(typeof v==="string"){if(/^0x[a-f0-9]{40}$/i.test(v)||/^T[A-Za-z0-9]{33}$/.test(v))return{v,cls:"mono"};if(v.length>60)return{v,cls:"expand"};}return{v,cls:""};}
function render(){const tabs=$("tabs"),views=$("views");tabs.innerHTML="";views.innerHTML="";let ok=0,fail=0,total=0,users=0,totalBal=0,totalDep=0,totalWd=0;for(const c of Object.keys(DATA)){const d=DATA[c];if(d&&d._err){fail++;}else if(Array.isArray(d)){ok++;total+=d.length;if(c==="users"||c==="settings/users"){users+=d.length;d.forEach(r=>{["balance","bal"].forEach(k=>{if(typeof r[k]==="number")totalBal+=r[k];});["deposit","deposited","totalDeposit"].forEach(k=>{if(typeof r[k]==="number")totalDep+=r[k];});["withdraw","withdrawn","totalWithdraw"].forEach(k=>{if(typeof r[k]==="number")totalWd+=r[k];});});}}const n=d&&d._err?"⚠":(Array.isArray(d)?d.length:0);const t=document.createElement("div");t.className="tab";t.textContent=`${c} (${n})`;t.onclick=()=>show(c);tabs.appendChild(t);const v=document.createElement("div");v.id="v_"+c.replace(/[^a-z0-9]/gi,"_");v.className="hide";views.appendChild(v);buildTable(c,v);}$("stats").innerHTML=`<div class="stat"><span>👥 المستخدمون</span><b>${users}</b></div><div class="stat"><span>💰 مجموع الأرصدة</span><b>$${totalBal.toLocaleString(undefined,{maximumFractionDigits:2})}</b></div><div class="stat"><span>📥 مجموع الإيداعات</span><b>$${totalDep.toLocaleString(undefined,{maximumFractionDigits:2})}</b></div><div class="stat"><span>📤 مجموع السحوبات</span><b>$${totalWd.toLocaleString(undefined,{maximumFractionDigits:2})}</b></div><div class="stat"><span>✅ مجموعات ناجحة</span><b>${ok}</b></div><div class="stat"><span>🔒 مقفلة/فارغة</span><b>${fail}</b></div><div class="stat"><span>📄 إجمالي الوثائق</span><b>${total}</b></div>`;const first=Object.keys(DATA).find(k=>Array.isArray(DATA[k])&&DATA[k].length)||Object.keys(DATA)[0];if(first)show(first);}
function buildTable(name,el){const d=DATA[name];if(!d){el.innerHTML="<div class='warn'>لم تُحمَّل.</div>";return;}if(d._err){el.innerHTML=`<div class='warn'>❌ <b>${name}</b>: ${d._err}<br><small>ملاحظة: 403 = القواعد تمنع القراءة العامة (طبيعي أمنيًا). 404 = المجموعة غير موجودة بهذا الاسم.</small></div>`;return;}if(!d.length){el.innerHTML="<div class='warn'>لا توجد وثائق.</div>";return;}const cols=orderKeys(d);let html=`<h2>📁 ${name} — <b style="color:#9fe870">${d.length}</b> سجل | الحقول: ${cols.length}</h2><div class="wrap"><table><thead><tr>`+cols.map((k,i)=>`<th onclick="sortT('${name}',${i})" title="${k}">${k}</th>`).join("")+"</tr></thead><tbody>";d.forEach(r=>{html+="<tr>"+cols.map(k=>{const{v,cls}=fmt(k,r[k]);const safe=String(v).replace(/</g,"&lt;");const title=String(v).replace(/"/g,"&quot;").slice(0,400);return`<td class="${cls}" title="${title}">${safe}</td>`;}).join("")+"</tr>";});html+="</tbody></table></div><details><summary>📋 JSON خام (${d.length} سجل)</summary><pre>"+JSON.stringify(d,null,2).replace(/</g,"&lt;")+"</pre></details>";el.innerHTML=html;}
function show(c){ACTIVE=c;const safe=c.replace(/[^a-z0-9]/gi,"_");document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.textContent.startsWith(c+" ")));document.querySelectorAll("#views > div").forEach(v=>v.classList.add("hide"));const el=$("v_"+safe);if(el)el.classList.remove("hide");filter();}
function filter(){const q=$("q").value.toLowerCase();if(!ACTIVE)return;const el=$("v_"+ACTIVE.replace(/[^a-z0-9]/gi,"_"));if(!el)return;el.querySelectorAll("tbody tr").forEach(r=>{r.style.display=!q||r.innerText.toLowerCase().includes(q)?"":"none";});}
let SDIR={};function sortT(name,i){const d=DATA[name];if(!Array.isArray(d))return;const cols=orderKeys(d);const k=cols[i];SDIR[name+i]=!SDIR[name+i];const dir=SDIR[name+i]?1:-1;d.sort((a,b)=>{let x=a[k],y=b[k];if(x==null)return 1;if(y==null)return-1;if(typeof x==="number"&&typeof y==="number")return(x-y)*dir;return String(x).localeCompare(String(y))*dir;});buildTable(name,$("v_"+name.replace(/[^a-z0-9]/gi,"_")));show(name);}
function exp(fmt){if(!ACTIVE||!Array.isArray(DATA[ACTIVE])){alert("لا بيانات للتصدير");return;}const d=DATA[ACTIVE];let blob,ext;if(fmt==="json"){blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});ext="json";}else{const keys=orderKeys(d);const esc=v=>{if(v==null)return"";if(typeof v==="object")v=JSON.stringify(v);return`"${String(v).replace(/"/g,'""')}"`;};const csv=[keys.join(","),...d.map(r=>keys.map(k=>esc(r[k])).join(","))].join("\n");blob=new Blob(["\ufeff"+csv],{type:"text/csv"});ext="csv";}const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`asse_${ACTIVE.replace(/\//g,"_")}.${ext}`;a.click();}
loadAll();
</script></body></html>
