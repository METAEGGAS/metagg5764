<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Logs</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<style>
body{
  font-family:Arial;
  background:#f2f3f5;
  padding:20px;
}
h2{margin-bottom:15px}
input{
  width:100%;
  box-sizing:border-box;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:15px;
}
.card{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:10px;
  box-shadow:0 2px 8px #0001;
}
.card b{font-size:17px}
.row{
  margin-top:7px;
  color:#555;
  font-size:13px;
  word-break:break-all;
}
.badge{
  display:inline-block;
  background:#198754;
  color:white;
  padding:4px 9px;
  border-radius:20px;
  font-size:12px;
}
#count{
  color:#666;
  margin-bottom:15px;
}
</style>
</head>

<body>

<h2>🔐 حسابات الأدمن</h2>

<input
  id="search"
  placeholder="ابحث بالاسم أو البريد أو UID أو الهاتف..."
>

<div id="count">جاري التحميل...</div>
<div id="admins">جاري جلب البيانات...</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyBSqx1BR2nf16PTJ5h7POC7ccYByPJtP6M",
  authDomain: "asse-app-16998.firebaseapp.com",
  projectId: "asse-app-16998",
  storageBucket: "asse-app-16998.firebasestorage.app",
  messagingSenderId: "835771799328",
  appId: "1:835771799328:web:b587a5da0cb129c2042945"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

let admins = [];


async function loadAdmins(){

  try{

    const snap = await db.collection("users").get();

    admins = [];

    snap.forEach(doc => {

      const d = doc.data();

      const role = String(d.role || "").toLowerCase();

      const isAdmin =
        role === "admin" ||
        role === "مدير" ||
        d.isAdmin === true ||
        d.admin === true ||
        d.isAdmin === "true" ||
        d.admin === "true";

      if(isAdmin){

        admins.push({
          id: doc.id,
          ...d
        });

      }

    });

    render();

  }catch(error){

    document.getElementById("admins").innerHTML =
      `<div class="card">❌ خطأ: ${error.message}</div>`;

    document.getElementById("count").textContent = "";

  }

}


function render(){

  const q =
    document.getElementById("search").value
    .trim()
    .toLowerCase();

  const result = admins.filter(a => {

    const text = [
      a.id,
      a.uid,
      a.name,
      a.username,
      a.fullName,
      a.displayName,
      a.email,
      a.emailAddress,
      a.phone,
      a.phoneNumber,
      a.mobile
    ]
    .filter(Boolean)
    .join(" ")
    .toLowerCase();

    return text.includes(q);

  });


  document.getElementById("count").textContent =
    `عدد الأدمن: ${result.length}`;


  if(!result.length){

    document.getElementById("admins").innerHTML =
      `<div class="card">لا توجد حسابات مطابقة.</div>`;

    return;

  }


  document.getElementById("admins").innerHTML =
    result.map(a => {

      const name =
        a.name ||
        a.username ||
        a.fullName ||
        a.displayName ||
        "بدون اسم";

      const email =
        a.email ||
        a.emailAddress ||
        "لا يوجد";

      const phone =
        a.phone ||
        a.phoneNumber ||
        a.mobile ||
        "لا يوجد";

      return `

      <div class="card">

        <b>${name}</b>

        <span class="badge">ADMIN</span>

        <div class="row">
          📧 البريد: ${email}
        </div>

        <div class="row">
          📱 الهاتف: ${phone}
        </div>

        <div class="row">
          🆔 UID / ID: ${a.uid || a.id}
        </div>

        <div class="row">
          👑 Role: ${a.role || "admin"}
        </div>

      </div>

      `;

    }).join("");

}


document
  .getElementById("search")
  .addEventListener("input", render);


loadAdmins();

</script>

</body>
</html>
