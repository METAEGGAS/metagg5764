<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Full Users Logs</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px;
  background:#f1f3f6;
  font-family:Arial,Tahoma,sans-serif
}

.top{
  background:#fff;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 2px 10px #0001
}

h2{margin:0 0 15px}

input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px
}

#count{
  margin-top:10px;
  color:#666
}

.user{
  background:#fff;
  border-radius:14px;
  margin-bottom:15px;
  overflow:hidden;
  box-shadow:0 3px 12px #0002
}

.head{
  background:#202b4d;
  color:#fff;
  padding:15px
}

.head h3{
  margin:0 0 7px
}

.meta{
  font-size:12px;
  opacity:.85;
  word-break:break-all;
  margin-top:4px
}

.body{
  padding:15px
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px
}

.field{
  background:#f7f8fa;
  border:1px solid #e5e7eb;
  border-radius:9px;
  padding:10px
}

.key{
  display:block;
  color:#777;
  font-size:11px;
  margin-bottom:5px
}

.value{
  display:block;
  color:#111;
  font-size:13px;
  word-break:break-all;
  white-space:pre-wrap
}

.empty{
  background:#fff;
  padding:20px;
  border-radius:12px;
  text-align:center
}
</style>
</head>

<body>

<div class="top">

<h2>👥 جميع المستخدمين - Full Logs</h2>

<input
 id="search"
 placeholder="ابحث داخل جميع بيانات المستخدمين..."
>

<div id="count">
جاري تحميل البيانات...
</div>

</div>

<div id="users"></div>

<script>

const firebaseConfig={
  apiKey:"AIzaSyBSqx1BR2nf16PTJ5h7POC7ccYByPJtP6M",
  authDomain:"asse-app-16998.firebaseapp.com",
  projectId:"asse-app-16998",
  storageBucket:"asse-app-16998.firebasestorage.app",
  messagingSenderId:"835771799328",
  appId:"1:835771799328:web:b587a5da0cb129c2042945"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();

let users=[];


/* حماية النص من HTML */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* تحويل قيم Firestore إلى نص */

function formatValue(value){

  if(value===null)
    return "null";

  if(value===undefined)
    return "undefined";

  if(value && typeof value.toDate==="function"){

    try{
      return value.toDate().toLocaleString("ar");
    }catch(e){}
  }

  if(typeof value==="object"){

    try{
      return JSON.stringify(value,null,2);
    }catch(e){
      return String(value);
    }

  }

  return String(value);

}


/* تحميل جميع المستخدمين */

async function loadUsers(){

  const container=
    document.getElementById("users");

  try{

    const snapshot=
      await db.collection("users").get();

    users=[];

    snapshot.forEach(doc=>{

      users.push({

        documentId:doc.id,

        ...doc.data()

      });

    });

    renderUsers();

  }catch(error){

    container.innerHTML=`

      <div class="empty">

        ❌ فشل تحميل المستخدمين

        <br><br>

        ${escapeHTML(error.message)}

      </div>

    `;

    document.getElementById("count").textContent="";

  }

}


/* عرض جميع المستخدمين */

function renderUsers(){

  const q=
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const result=users.filter(user=>{

    if(!q)
      return true;

    return JSON.stringify(user)
      .toLowerCase()
      .includes(q);

  });


  document.getElementById("count").textContent=
    `المستخدمون: ${result.length} / ${users.length}`;


  if(!result.length){

    document.getElementById("users").innerHTML=`

      <div class="empty">
        لا توجد نتائج.
      </div>

    `;

    return;

  }


  document.getElementById("users").innerHTML=

    result.map((user,index)=>{

      const name=
        user.name ||
        user.username ||
        user.fullName ||
        user.displayName ||
        "بدون اسم";


      const fields=
        Object.keys(user)
          .filter(key=>key!=="documentId");


      let fieldsHTML="";


      fields.forEach(key=>{

        fieldsHTML+=`

          <div class="field">

            <span class="key">
              ${escapeHTML(key)}
            </span>

            <span class="value">
              ${escapeHTML(
                formatValue(user[key])
              )}
            </span>

          </div>

        `;

      });


      return`

        <div class="user">

          <div class="head">

            <h3>
              👤 ${escapeHTML(name)}
            </h3>

            <div class="meta">
              Document ID:
              ${escapeHTML(user.documentId)}
            </div>

            <div class="meta">
              المستخدم رقم:
              ${index+1}
            </div>

          </div>

          <div class="body">

            <div class="grid">

              ${fieldsHTML}

            </div>

          </div>

        </div>

      `;

    }).join("");

}


/* البحث */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderUsers
  );


loadUsers();

</script>

</body>
</html>
