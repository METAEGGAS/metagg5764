<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>المستخدمون والمسؤولون</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  background:#f1f3f6;
  font-family:Arial,Tahoma,sans-serif;
}

.container{
  max-width:1200px;
  margin:auto;
}

.top{
  background:#fff;
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
  box-shadow:0 3px 15px #0001;
}

h1{
  margin:0 0 15px;
  font-size:24px;
}

.search{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
  font-size:15px;
}

.search:focus{
  border-color:#667eea;
}

.count{
  margin-top:12px;
  color:#666;
  font-size:14px;
}


/* عناوين الأقسام */

.section{
  padding:14px 18px;
  border-radius:12px;
  margin:20px 0 12px;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.section-admin{
  background:#fff3cd;
  color:#664d03;
  border-right:5px solid #f0b429;
}

.section-users{
  background:#e9ecef;
  color:#495057;
  border-right:5px solid #6c757d;
}

.number{
  padding:4px 11px;
  border-radius:20px;
  font-size:12px;
  background:#666;
  color:white;
}

.section-admin .number{
  background:#e0a800;
}


/* بطاقة المستخدم */

.user{
  background:white;
  border-radius:14px;
  overflow:hidden;
  margin-bottom:14px;
  box-shadow:0 3px 12px #0002;
}

.head{
  background:#202b4d;
  color:white;
  padding:16px;
}

.head h3{
  margin:0 0 8px;
  font-size:18px;
}

.meta{
  font-size:12px;
  opacity:.85;
  margin-top:5px;
  word-break:break-all;
}


/* بطاقة المسؤول */

.admin-user{
  border:3px solid #f0b429;
  box-shadow:0 5px 20px #f0b42955;
}

.admin-user .head{
  background:linear-gradient(135deg,#302000,#765500);
}

.admin-badge{
  display:inline-block;
  background:#f5c542;
  color:#241900;
  padding:5px 11px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
  margin-right:7px;
  vertical-align:middle;
}

.admin-label{
  display:inline-block;
  margin-top:9px;
  background:#fff3cd;
  color:#664d03;
  padding:6px 11px;
  border-radius:7px;
  font-size:12px;
  font-weight:bold;
}


/* بيانات المستخدم */

.body{
  padding:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px;
}

.field{
  background:#f7f8fa;
  border:1px solid #e4e7eb;
  border-radius:9px;
  padding:10px;
}

.key{
  display:block;
  color:#777;
  font-size:11px;
  margin-bottom:5px;
}

.value{
  display:block;
  color:#111;
  font-size:13px;
  word-break:break-all;
  white-space:pre-wrap;
}

.loading,
.empty,
.error{
  background:white;
  padding:30px;
  border-radius:12px;
  text-align:center;
}

.error{
  background:#f8d7da;
  color:#842029;
}

</style>
</head>


<body>

<div class="container">

  <div class="top">

    <h1>👥 جميع المستخدمين</h1>

    <input
      id="search"
      class="search"
      type="text"
      placeholder="🔎 ابحث في جميع بيانات المستخدمين..."
    >

    <div id="count" class="count">
      جاري التحميل...
    </div>

  </div>


  <div id="users">

    <div class="loading">
      ⏳ جاري جلب المستخدمين...
    </div>

  </div>

</div>


<script>

/* =========================================
   Firebase Configuration
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBSqx1BR2nf16PTJ5h7POC7ccYByPJtP6M",

  authDomain:
    "asse-app-16998.firebaseapp.com",

  projectId:
    "asse-app-16998",

  storageBucket:
    "asse-app-16998.firebasestorage.app",

  messagingSenderId:
    "835771799328",

  appId:
    "1:835771799328:web:b587a5da0cb129c2042945"

};


firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


let users = [];


/* =========================================
   حماية HTML
========================================= */

function escapeHTML(value){

  return String(value)

    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   تحويل بيانات Firestore
========================================= */

function formatValue(value){

  if(value === null)
    return "null";

  if(value === undefined)
    return "undefined";


  /* Firebase Timestamp */

  if(
    value &&
    typeof value.toDate === "function"
  ){

    try{

      return value
        .toDate()
        .toLocaleString("ar");

    }catch(e){}

  }


  /* Arrays / Objects */

  if(typeof value === "object"){

    try{

      return JSON.stringify(
        value,
        null,
        2
      );

    }catch(e){

      return String(value);

    }

  }


  return String(value);

}


/* =========================================
   تحديد المسؤول تلقائياً
========================================= */

function isAdmin(user){

  const role =
    String(user.role || "")
      .trim()
      .toLowerCase();


  return (

    role === "admin" ||

    role === "administrator" ||

    role === "مدير" ||

    role === "مسؤول" ||

    user.isAdmin === true ||

    user.admin === true ||

    user.isAdmin === "true" ||

    user.admin === "true"

  );

}


/* =========================================
   تحميل جميع المستخدمين
========================================= */

async function loadUsers(){

  const box =
    document.getElementById("users");


  try{

    const snapshot =
      await db
        .collection("users")
        .get();


    users = [];


    snapshot.forEach(doc => {

      users.push({

        documentId:doc.id,

        ...doc.data()

      });

    });


    renderUsers();


  }catch(error){

    box.innerHTML = `

      <div class="error">

        ❌ حدث خطأ أثناء تحميل البيانات

        <br><br>

        ${escapeHTML(error.message)}

      </div>

    `;


    document.getElementById("count")
      .textContent = "";

  }

}


/* =========================================
   عرض المستخدمين
========================================= */

function renderUsers(){

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  /* البحث في كل البيانات */

  let filtered =
    users.filter(user => {

      if(!search)
        return true;


      return JSON.stringify(user)
        .toLowerCase()
        .includes(search);

    });


  /* ======================================
     فصل المسؤولين عن المستخدمين
  ====================================== */

  const admins =
    filtered.filter(isAdmin);


  const normalUsers =
    filtered.filter(user => !isAdmin(user));


  document.getElementById("count")
    .textContent =
      `🛡️ المسؤولون: ${admins.length} | 👤 المستخدمون: ${normalUsers.length} | الإجمالي: ${filtered.length}`;


  if(!filtered.length){

    document.getElementById("users")
      .innerHTML = `

        <div class="empty">
          لا توجد نتائج.
        </div>

      `;

    return;

  }


  let html = "";


  /* ======================================
     قسم المسؤولين أولاً
  ====================================== */

  if(admins.length){

    html += `

      <div class="section section-admin">

        <div>
          🛡️ حسابات المسؤولين
        </div>

        <span class="number">
          ${admins.length}
        </span>

      </div>

    `;


    admins.forEach((user,index) => {

      html += createUserCard(
        user,
        true,
        index + 1
      );

    });

  }


  /* ======================================
     قسم المستخدمين
  ====================================== */

  if(normalUsers.length){

    html += `

      <div class="section section-users">

        <div>
          👤 باقي المستخدمين
        </div>

        <span class="number">
          ${normalUsers.length}
        </span>

      </div>

    `;


    normalUsers.forEach((user,index) => {

      html += createUserCard(
        user,
        false,
        index + 1
      );

    });

  }


  document.getElementById("users")
    .innerHTML = html;

}


/* =========================================
   إنشاء بطاقة المستخدم
========================================= */

function createUserCard(
  user,
  admin,
  number
){

  const name =
    user.name ||
    user.username ||
    user.fullName ||
    user.displayName ||
    "بدون اسم";


  let fields = "";


  Object.keys(user)

    .filter(
      key => key !== "documentId"
    )

    .forEach(key => {

      fields += `

        <div class="field">

          <span class="key">
            ${escapeHTML(key)}
          </span>

          <span class="value">
            ${escapeHTML(
              formatValue(user[key])
            )}
          </span>

        </div>

      `;

    });


  return `

    <div class="user ${admin ? "admin-user" : ""}">

      <div class="head">

        <h3>

          ${admin ? "🛡️" : "👤"}

          ${escapeHTML(name)}

          ${
            admin

            ? `

              <span class="admin-badge">
                ADMIN • مسؤول
              </span>

            `

            : ""

          }

        </h3>


        <div class="meta">

          #${number}

        </div>


        <div class="meta">

          🆔 Document ID:
          ${escapeHTML(user.documentId)}

        </div>


        ${
          admin

          ? `

            <div class="admin-label">

              🛡️ هذا الحساب مسؤول

            </div>

          `

          : ""

        }

      </div>


      <div class="body">

        <div class="grid">

          ${fields}

        </div>

      </div>

    </div>

  `;

}


/* =========================================
   البحث المباشر
========================================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderUsers
  );


/* =========================================
   تشغيل
========================================= */

loadUsers();


/* تحديث كل دقيقة */

setInterval(
  loadUsers,
  60000
);

</script>

</body>
</html>
