<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>المستخدمون</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  padding:20px;
  background:#f2f4f7;
  font-family:Arial,Tahoma,sans-serif;
}

.container{
  max-width:1000px;
  margin:auto;
}

.header{
  background:#202b4d;
  color:white;
  padding:20px;
  border-radius:15px;
  margin-bottom:15px;
}

.header h2{
  margin:0 0 12px;
}

.search{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

.count{
  margin-top:12px;
  font-size:13px;
  opacity:.8;
}


/* بطاقة المستخدم */

.user{
  background:white;
  border-radius:14px;
  margin-bottom:12px;
  padding:16px;
  box-shadow:0 3px 12px #0001;

  display:flex;
  align-items:center;
  gap:15px;
}


/* صورة المستخدم */

.avatar{
  width:55px;
  height:55px;
  border-radius:50%;
  background:#667eea;
  color:white;

  display:flex;
  align-items:center;
  justify-content:center;

  font-size:22px;
  font-weight:bold;

  flex-shrink:0;
}


/* معلومات */

.info{
  flex:1;
  min-width:0;
}

.username{
  font-size:17px;
  font-weight:bold;
  color:#202b4d;
}

.uid{
  margin-top:5px;
  font-size:11px;
  color:#888;
  word-break:break-all;
}


/* الدور */

.role{
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
}


/* عضو */

.member{
  background:#e9ecef;
  color:#495057;
}


/* أدمن */

.admin{
  background:#fff3cd;
  color:#856404;
}


/* مسؤول */

.manager{
  background:#d1ecf1;
  color:#0c5460;
}


/* علامة الإدارة */

.admin-mark{
  font-size:20px;
  margin-left:5px;
}


/* بطاقات الإدارة */

.admin-user{
  border:2px solid #f0b429;
  background:#fffdf5;
}


.manager-user{
  border:2px solid #17a2b8;
}


.loading,
.empty,
.error{
  background:white;
  padding:25px;
  border-radius:12px;
  text-align:center;
}


/* الهاتف */

@media(max-width:600px){

  .user{
    align-items:flex-start;
  }

  .role{
    font-size:11px;
    padding:5px 8px;
  }

}

</style>
</head>


<body>

<div class="container">

  <div class="header">

    <h2>👥 المستخدمون</h2>

    <input
      id="search"
      class="search"
      placeholder="🔎 ابحث عن Username أو UID أو الدور..."
    >

    <div id="count" class="count">
      جاري التحميل...
    </div>

  </div>


  <div id="users">

    <div class="loading">
      ⏳ جاري تحميل المستخدمين...
    </div>

  </div>

</div>


<script>

/* ===================================
   Firebase
=================================== */

const firebaseConfig={

  apiKey:
    "AIzaSyBSqx1BR2nf16PTJ5h7POC7ccYByPJtP6M",

  authDomain:
    "asse-app-16998.firebaseapp.com",

  projectId:
    "asse-app-16998",

  storageBucket:
    "asse-app-16998.firebasestorage.app",

  messagingSenderId:
    "835771799328",

  appId:
    "1:835771799328:web:b587a5da0cb129c2042945"

};


firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();


let users=[];


/* ===================================
   تحديد الدور
=================================== */

function getRole(user){

  const role=
    String(user.role || "")
      .trim()
      .toLowerCase();


  /* مسؤول */

  if(

    role==="مسؤول" ||
    role==="manager" ||
    role==="moderator" ||
    role==="مسؤول النظام" ||

    user.isManager===true ||
    user.manager===true

  ){

    return "manager";

  }


  /* أدمن */

  if(

    role==="admin" ||
    role==="administrator" ||
    role==="مدير" ||

    user.isAdmin===true ||
    user.admin===true ||

    user.isAdmin==="true" ||
    user.admin==="true"

  ){

    return "admin";

  }


  /* عضو */

  return "member";

}


/* ===================================
   اسم الدور
=================================== */

function roleName(role){

  if(role==="manager")
    return "مسؤول";

  if(role==="admin")
    return "أدمن";

  return "عضو";

}


/* ===================================
   HTML حماية
=================================== */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ===================================
   تحميل المستخدمين
=================================== */

async function loadUsers(){

  try{

    const snapshot=
      await db
        .collection("users")
        .get();


    users=[];


    snapshot.forEach(doc=>{

      users.push({

        id:doc.id,

        ...doc.data()

      });

    });


    renderUsers();


  }catch(error){

    document.getElementById("users")
      .innerHTML=`

        <div class="error">

          ❌ خطأ في تحميل المستخدمين

          <br><br>

          ${escapeHTML(error.message)}

        </div>

      `;

  }

}


/* ===================================
   عرض المستخدمين
=================================== */

function renderUsers(){

  const search=
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  let list=
    users.filter(user=>{

      if(!search)
        return true;


      const username=
        user.username ||
        user.userName ||
        user.name ||
        user.displayName ||
        "";


      const uid=
        user.uid ||
        user.id ||
        "";


      const role=
        roleName(
          getRole(user)
        );


      return (

        String(username)
          .toLowerCase()
          .includes(search)

        ||

        String(uid)
          .toLowerCase()
          .includes(search)

        ||

        role
          .toLowerCase()
          .includes(search)

      );

    });


  /* ===================================
     ترتيب الأدمن والمسؤول أولاً
  =================================== */

  list.sort((a,b)=>{

    const ra=getRole(a);
    const rb=getRole(b);


    const weight={

      manager:0,
      admin:1,
      member:2

    };


    return weight[ra]-weight[rb];

  });


  const managers=
    list.filter(
      u=>getRole(u)==="manager"
    ).length;


  const admins=
    list.filter(
      u=>getRole(u)==="admin"
    ).length;


  const members=
    list.filter(
      u=>getRole(u)==="member"
    ).length;


  document.getElementById("count")
    .textContent=
      `🛡️ مسؤول: ${managers} | 👑 أدمن: ${admins} | 👤 أعضاء: ${members}`;


  if(!list.length){

    document.getElementById("users")
      .innerHTML=`

        <div class="empty">
          لا يوجد مستخدمون.
        </div>

      `;

    return;

  }


  let html="";


  list.forEach(user=>{

    const role=
      getRole(user);


    const username=
      user.username ||
      user.userName ||
      user.name ||
      user.displayName ||
      "بدون Username";


    const uid=
      user.uid ||
      user.id ||
      "غير معروف";


    let icon="👤";


    if(role==="admin")
      icon="👑";


    if(role==="manager")
      icon="🛡️";


    html+=`

      <div class="user

        ${
          role==="admin"
          ? "admin-user"
          : ""
        }

        ${
          role==="manager"
          ? "manager-user"
          : ""
        }

      ">


        <div class="avatar">

          ${icon}

        </div>


        <div class="info">

          <div class="username">

            ${escapeHTML(username)}

            ${
              role==="admin"

              ? `
                <span class="admin-mark">
                  👑
                </span>
              `

              : ""
            }

            ${
              role==="manager"

              ? `
                <span class="admin-mark">
                  🛡️
                </span>
              `

              : ""
            }

          </div>


          <div class="uid">

            UID:
            ${escapeHTML(uid)}

          </div>

        </div>


        <div class="role

          ${
            role==="member"
            ? "member"
            : ""
          }

          ${
            role==="admin"
            ? "admin"
            : ""
          }

          ${
            role==="manager"
            ? "manager"
            : ""
          }

        ">

          ${
            role==="admin"
            ? "👑 "
            : ""
          }

          ${
            role==="manager"
            ? "🛡️ "
            : ""
          }

          ${roleName(role)}

        </div>


      </div>

    `;

  });


  document.getElementById("users")
    .innerHTML=html;

}


/* ===================================
   البحث
=================================== */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderUsers
  );


/* ===================================
   تشغيل
=================================== */

loadUsers();


/* تحديث تلقائي */

setInterval(
  loadUsers,
  60000
);

</script>

</body>
</html>
