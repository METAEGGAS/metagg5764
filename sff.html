<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سجل المستخدمين</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px;
  background:#f1f3f6;
  font-family:Arial,Tahoma,sans-serif;
}

.top{
  background:#fff;
  padding:18px;
  border-radius:14px;
  margin-bottom:18px;
  box-shadow:0 3px 12px #0001;
}

h2{
  margin:0 0 15px;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#667eea;
}

#count{
  margin-top:10px;
  color:#666;
  font-size:14px;
}

.user{
  background:#fff;
  border-radius:14px;
  margin-bottom:15px;
  overflow:hidden;
  box-shadow:0 3px 12px #0002;
}

.head{
  background:#202b4d;
  color:#fff;
  padding:16px;
}

.head h3{
  margin:0 0 8px;
  font-size:18px;
}

.meta{
  font-size:12px;
  opacity:.85;
  word-break:break-all;
  margin-top:4px;
}

.body{
  padding:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px;
}

.field{
  background:#f7f8fa;
  border:1px solid #e5e7eb;
  border-radius:9px;
  padding:10px;
}

.key{
  display:block;
  color:#777;
  font-size:11px;
  margin-bottom:5px;
}

.value{
  display:block;
  color:#111;
  font-size:13px;
  word-break:break-all;
  white-space:pre-wrap;
}

.admin-user{
  border:3px solid #f0b429;
  box-shadow:0 5px 18px #f0b42944;
}

.admin-user .head{
  background:linear-gradient(135deg,#302000,#765500);
}

.admin-badge{
  display:inline-block;
  background:#f5c542;
  color:#241900;
  padding:5px 10px;
  border-radius:20px;
  font-size:11px;
  margin-right:7px;
  font-weight:bold;
  vertical-align:middle;
}

.admin-label{
  display:inline-block;
  margin-top:8px;
  background:#fff3cd;
  color:#664d03;
  padding:6px 10px;
  border-radius:7px;
  font-size:12px;
  font-weight:bold;
}

.empty{
  background:#fff;
  padding:25px;
  border-radius:12px;
  text-align:center;
}

.error{
  background:#f8d7da;
  color:#842029;
  padding:15px;
  border-radius:10px;
}

.loading{
  text-align:center;
  padding:40px;
  background:#fff;
  border-radius:12px;
}
</style>
</head>

<body>

<div class="top">

<h2>👥 سجل جميع المستخدمين</h2>

<input
 id="search"
 type="text"
 placeholder="🔎 ابحث بالاسم أو البريد أو الهاتف أو UID أو أي بيانات..."
>

<div id="count">
جاري تحميل البيانات...
</div>

</div>

<div id="users">
  <div class="loading">
    جاري جلب بيانات المستخدمين...
  </div>
</div>


<script>

/* ==============================
   Firebase
============================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyBSqx1BR2nf16PTJ5h7POC7ccYByPJtP6M",

  authDomain:
    "asse-app-16998.firebaseapp.com",

  projectId:
    "asse-app-16998",

  storageBucket:
    "asse-app-16998.firebasestorage.app",

  messagingSenderId:
    "835771799328",

  appId:
    "1:835771799328:web:b587a5da0cb129c2042945"

};


firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();


let users = [];


/* ==============================
   حماية HTML
============================== */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* ==============================
   تحويل بيانات Firestore
============================== */

function formatValue(value){

  if(value === null)
    return "null";

  if(value === undefined)
    return "undefined";


  /* Timestamp */

  if(
    value &&
    typeof value.toDate === "function"
  ){

    try{

      return value
        .toDate()
        .toLocaleString("ar");

    }catch(e){}

  }


  /* Arrays / Objects */

  if(typeof value === "object"){

    try{

      return JSON.stringify(
        value,
        null,
        2
      );

    }catch(e){

      return String(value);

    }

  }


  return String(value);

}


/* ==============================
   تحديد المسؤول تلقائياً
============================== */

function isAdmin(user){

  const role =
    String(user.role || "")
      .trim()
      .toLowerCase();


  return (

    role === "admin" ||

    role === "administrator" ||

    role === "مدير" ||

    role === "مسؤول" ||

    user.isAdmin === true ||

    user.admin === true ||

    user.isAdmin === "true" ||

    user.admin === "true"

  );

}


/* ==============================
   تحميل المستخدمين
============================== */

async function loadUsers(){

  const container =
    document.getElementById("users");


  try{

    const snapshot =
      await db
        .collection("users")
        .get();


    users = [];


    snapshot.forEach(doc => {

      users.push({

        documentId: doc.id,

        ...doc.data()

      });

    });


    renderUsers();


  }catch(error){

    container.innerHTML = `

      <div class="error">

        ❌ فشل تحميل البيانات

        <br><br>

        ${escapeHTML(error.message)}

      </div>

    `;


    document.getElementById("count")
      .textContent = "";

  }

}


/* ==============================
   عرض المستخدمين
============================== */

function renderUsers(){

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  /* البحث */

  let result =
    users.filter(user => {

      if(!search)
        return true;


      return JSON.stringify(user)
        .toLowerCase()
        .includes(search);

    });


  /* ==============================
     الأدمن أولاً
  ============================== */

  result.sort((a,b) => {

    const aAdmin = isAdmin(a);
    const bAdmin = isAdmin(b);


    if(aAdmin && !bAdmin)
      return -1;


    if(!aAdmin && bAdmin)
      return 1;


    return 0;

  });


  document.getElementById("count")
    .textContent =
      `المستخدمون: ${result.length} / ${users.length}`;


  if(!result.length){

    document.getElementById("users")
      .innerHTML = `

        <div class="empty">
          لا توجد نتائج.
        </div>

      `;

    return;

  }


  let html = "";


  result.forEach((user,index) => {

    const admin =
      isAdmin(user);


    const name =
      user.name ||
      user.username ||
      user.fullName ||
      user.displayName ||
      "بدون اسم";


    const fields =
      Object.keys(user)
        .filter(
          key => key !== "documentId"
        );


    let fieldsHTML = "";


    fields.forEach(key => {

      fieldsHTML += `

        <div class="field">

          <span class="key">
            ${escapeHTML(key)}
          </span>

          <span class="value">
            ${escapeHTML(
              formatValue(user[key])
            )}
          </span>

        </div>

      `;

    });


    html += `

      <div class="user ${admin ? "admin-user" : ""}">

        <div class="head">

          <h3>

            ${admin ? "🛡️" : "👤"}

            ${escapeHTML(name)}

            ${
              admin

              ? `

                <span class="admin-badge">
                  ADMIN / مسؤول
                </span>

              `

              : ""

            }

          </h3>


          <div class="meta">

            🆔 Document ID:
            ${escapeHTML(user.documentId)}

          </div>


          <div class="meta">

            #${index + 1}

          </div>


          ${
            admin

            ? `

              <div class="admin-label">

                🛡️ هذا الحساب مسؤول

              </div>

            `

            : ""

          }

        </div>


        <div class="body">

          <div class="grid">

            ${fieldsHTML}

          </div>

        </div>

      </div>

    `;

  });


  document.getElementById("users")
    .innerHTML = html;

}


/* ==============================
   البحث المباشر
============================== */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderUsers
  );


/* ==============================
   تشغيل
============================== */

loadUsers();


/* تحديث تلقائي كل دقيقة */

setInterval(
  loadUsers,
  60000
);

</script>

</body>
</html>
