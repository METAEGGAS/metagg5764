<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Full Logs</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:20px;
  background:#f1f3f6;
  font-family:Arial,Tahoma,sans-serif;
}

h2{
  margin-top:0;
}

.top{
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 2px 10px #0001;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  outline:none;
}

#count{
  margin-top:10px;
  color:#666;
}

.admin{
  background:white;
  border-radius:14px;
  margin-bottom:15px;
  overflow:hidden;
  box-shadow:0 3px 12px #0002;
}

.admin-head{
  padding:15px;
  background:#202b4d;
  color:white;
}

.admin-head h3{
  margin:0 0 8px;
}

.badge{
  display:inline-block;
  background:#20c997;
  color:white;
  padding:4px 9px;
  border-radius:20px;
  font-size:12px;
}

.meta{
  font-size:12px;
  opacity:.85;
  margin-top:6px;
  word-break:break-all;
}

.body{
  padding:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:10px;
}

.field{
  background:#f7f8fa;
  border:1px solid #e5e7eb;
  border-radius:9px;
  padding:10px;
}

.key{
  display:block;
  color:#777;
  font-size:11px;
  margin-bottom:5px;
}

.value{
  display:block;
  color:#111;
  font-size:13px;
  word-break:break-all;
  white-space:pre-wrap;
}

.empty{
  background:white;
  padding:20px;
  border-radius:12px;
  text-align:center;
}
</style>
</head>

<body>

<div class="top">

<h2>🔐 Full Admin Logs</h2>

<input
 id="search"
 type="text"
 placeholder="ابحث في جميع بيانات الأدمن..."
>

<div id="count">
جاري تحميل البيانات...
</div>

</div>

<div id="admins"></div>


<script>

const firebaseConfig = {
  apiKey: "AIzaSyBSqx1BR2nf16PTJ5h7POC7ccYByPJtP6M",
  authDomain: "asse-app-16998.firebaseapp.com",
  projectId: "asse-app-16998",
  storageBucket: "asse-app-16998.firebasestorage.app",
  messagingSenderId: "835771799328",
  appId: "1:835771799328:web:b587a5da0cb129c2042945"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

let admins = [];


/* تحويل أي قيمة Firebase إلى نص واضح */

function formatValue(value){

  if(value === null)
    return "null";

  if(value === undefined)
    return "undefined";

  if(typeof value === "object"){

    if(value.toDate){
      try{
        return value.toDate().toLocaleString("ar");
      }catch(e){}
    }

    if(Array.isArray(value)){
      return JSON.stringify(value,null,2);
    }

    return JSON.stringify(value,null,2);
  }

  return String(value);
}


/* حماية HTML */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* تحميل الأدمن */

async function loadAdmins(){

  const container =
    document.getElementById("admins");

  try{

    const snapshot =
      await db.collection("users").get();

    admins=[];

    snapshot.forEach(doc=>{

      const data=doc.data();

      const role =
        String(data.role || "").toLowerCase();

      const isAdmin =
        role === "admin" ||
        role === "مدير" ||
        data.isAdmin === true ||
        data.admin === true ||
        data.isAdmin === "true" ||
        data.admin === "true";

      if(isAdmin){

        admins.push({

          documentId:doc.id,

          ...data

        });

      }

    });

    renderAdmins();

  }catch(error){

    container.innerHTML=`
      <div class="empty">
        ❌ فشل تحميل البيانات
        <br><br>
        ${escapeHTML(error.message)}
      </div>
    `;

    document.getElementById("count").textContent="";

  }

}


/* عرض جميع بيانات كل Admin */

function renderAdmins(){

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();


  const result=admins.filter(admin=>{

    if(!search)
      return true;

    /*
      البحث داخل جميع بيانات الوثيقة
      وليس فقط الاسم والبريد.
    */

    return JSON.stringify(admin)
      .toLowerCase()
      .includes(search);

  });


  document.getElementById("count").textContent =
    `عدد الأدمن: ${result.length} / ${admins.length}`;


  if(!result.length){

    document.getElementById("admins").innerHTML=`
      <div class="empty">
        لا توجد نتائج.
      </div>
    `;

    return;

  }


  document.getElementById("admins").innerHTML =
    result.map((admin,index)=>{

      const name =
        admin.name ||
        admin.username ||
        admin.fullName ||
        admin.displayName ||
        "بدون اسم";


      /*
        حذف documentId من الحقول
        لأنه سيعرض في رأس البطاقة.
      */

      const fields =
        Object.keys(admin)
        .filter(key=>key !== "documentId");


      let html="";

      fields.forEach(key=>{

        const value =
          formatValue(admin[key]);

        html+=`

          <div class="field">

            <span class="key">
              ${escapeHTML(key)}
            </span>

            <span class="value">
              ${escapeHTML(value)}
            </span>

          </div>

        `;

      });


      return `

        <div class="admin">

          <div class="admin-head">

            <h3>
              👤 ${escapeHTML(name)}
              <span class="badge">
                ADMIN
              </span>
            </h3>

            <div class="meta">
              Document ID:
              ${escapeHTML(admin.documentId)}
            </div>

            <div class="meta">
              رقم الحساب:
              ${index+1}
            </div>

          </div>


          <div class="body">

            <div class="grid">

              ${html}

            </div>

          </div>

        </div>

      `;

    }).join("");

}


/* البحث اللحظي */

document
  .getElementById("search")
  .addEventListener(
    "input",
    renderAdmins
  );


/* تشغيل */

loadAdmins();

</script>

</body>
</html>
