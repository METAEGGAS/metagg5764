<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سجل المستخدمين الكامل</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:15px;
  background:#f1f3f6;
  font-family:Arial,Tahoma,sans-serif;
}

.container{
  max-width:1100px;
  margin:auto;
}

.header{
  background:linear-gradient(135deg,#202b4d,#394b82);
  color:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:18px;
}

.header h2{
  margin:0 0 15px;
}

.search{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  font-size:16px;
  outline:none;
  direction:ltr;
  text-align:left;
}

.count{
  margin-top:12px;
  font-size:13px;
}

.section{
  padding:13px 16px;
  border-radius:11px;
  margin:18px 0 10px;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
}

.admin-section{
  background:#fff3cd;
  color:#664d03;
  border-right:5px solid #f0b429;
}

.user-section{
  background:#e9ecef;
  color:#495057;
  border-right:5px solid #777;
}

.card{
  background:#fff;
  border-radius:15px;
  margin-bottom:15px;
  overflow:hidden;
  box-shadow:0 4px 16px #0002;
}

.card.admin{
  border:2px solid #f0b429;
}

.card.manager{
  border:2px solid #17a2b8;
}

.card-head{
  background:#202b4d;
  color:#fff;
  padding:17px;
}

.card.admin .card-head{
  background:linear-gradient(135deg,#302000,#765500);
}

.card.manager .card-head{
  background:linear-gradient(135deg,#073c47,#087f8c);
}

.username{
  font-size:19px;
  font-weight:bold;
}

.badge{
  display:inline-block;
  margin-right:7px;
  padding:5px 10px;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.badge-admin{
  background:#f5c542;
  color:#241900;
}

.badge-manager{
  background:#8de3ed;
  color:#073c47;
}

.badge-member{
  background:#ddd;
  color:#444;
}

.uid{
  margin-top:7px;
  font-size:11px;
  opacity:.8;
  word-break:break-all;
}

.data{
  padding:15px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:10px;
}

.field{
  background:#f8f9fb;
  border:1px solid #e2e5e9;
  border-radius:9px;
  padding:11px;
}

.key{
  display:block;
  color:#707070;
  font-size:11px;
  margin-bottom:6px;
  font-weight:bold;
}

.value{
  display:block;
  color:#171717;
  font-size:13px;
  white-space:pre-wrap;
  word-break:break-word;
  direction:auto;
}

.empty,
.loading,
.error{
  background:white;
  padding:30px;
  border-radius:12px;
  text-align:center;
}

.error{
  color:#842029;
  background:#f8d7da;
}

@media(max-width:600px){
  body{padding:8px}

  .grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="container">

  <div class="header">

    <h2>📋 سجل المستخدمين الكامل</h2>

    <input
      id="search"
      class="search"
      type="tel"
      inputmode="tel"
      placeholder="📱 اكتب رقم الهاتف للبحث..."
    >

    <div id="count">
      جاري تحميل البيانات...
    </div>

  </div>

  <div id="users">

    <div class="loading">
      ⏳ جاري تحميل المستخدمين...
    </div>

  </div>

</div>

<script>

/* =========================================
   Firebase
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBSqx1BR2nf16PTJ5h7POC7ccYByPJtP6M",

  authDomain:
    "asse-app-16998.firebaseapp.com",

  projectId:
    "asse-app-16998",

  storageBucket:
    "asse-app-16998.firebasestorage.app",

  messagingSenderId:
    "835771799328",

  appId:
    "1:835771799328:web:b587a5da0cb129c2042945"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

let users = [];


/* =========================================
   حماية HTML
========================================= */

function esc(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   تحويل قيمة Firestore إلى نص
========================================= */

function formatValue(value){

  if(value === null)
    return "null";

  if(value === undefined)
    return "undefined";


  if(
    value &&
    typeof value.toDate === "function"
  ){

    try{
      return value.toDate().toLocaleString("ar");
    }catch(e){}

  }


  if(typeof value === "object"){

    try{

      return JSON.stringify(
        value,
        null,
        2
      );

    }catch(e){

      return String(value);

    }

  }


  return String(value);

}


/* =========================================
   تحديد الدور
========================================= */

function getRole(user){

  const role =
    String(user.role || "")
      .trim()
      .toLowerCase();


  if(

    role === "manager" ||
    role === "moderator" ||
    role === "مسؤول" ||
    role === "مسؤول النظام" ||
    user.isManager === true ||
    user.manager === true

  ){

    return "manager";

  }


  if(

    role === "admin" ||
    role === "administrator" ||
    role === "مدير" ||
    user.isAdmin === true ||
    user.admin === true ||
    user.isAdmin === "true" ||
    user.admin === "true"

  ){

    return "admin";

  }


  return "member";

}


/* =========================================
   تنظيف الهاتف
========================================= */

function cleanPhone(value){

  return String(value || "")
    .replace(/[^\d+]/g,"");

}


/* =========================================
   تحميل جميع المستخدمين
========================================= */

async function loadUsers(){

  try{

    const snapshot =
      await db
        .collection("users")
        .get();


    users = [];


    snapshot.forEach(doc => {

      users.push({

        documentId:doc.id,

        ...doc.data()

      });

    });


    searchUsers();


  }catch(error){

    document.getElementById("users")
      .innerHTML = `

        <div class="error">

          ❌ فشل تحميل بيانات Firestore

          <br><br>

          ${esc(error.message)}

        </div>

      `;

  }

}


/* =========================================
   البحث برقم الهاتف
========================================= */

function searchUsers(){

  const search =
    cleanPhone(
      document.getElementById("search").value
    );


  let result = users;


  if(search){

    result = users.filter(user => {

      const phones = [

        user.phone,
        user.phoneNumber,
        user.mobile,
        user.tel,
        user.telephone

      ];


      return phones.some(phone => {

        return cleanPhone(phone)
          .includes(search);

      });

    });

  }


  /*
     الترتيب:
     مسؤول
     أدمن
     عضو
  */

  result.sort((a,b)=>{

    const weight = {
      manager:0,
      admin:1,
      member:2
    };

    return weight[getRole(a)]
         - weight[getRole(b)];

  });


  render(result);

}


/* =========================================
   عرض البيانات
========================================= */

function render(list){

  const container =
    document.getElementById("users");


  document.getElementById("count")
    .textContent =
      `عدد النتائج: ${list.length}`;


  if(!list.length){

    container.innerHTML = `

      <div class="empty">

        📱 لم يتم العثور على مستخدم بهذا الرقم

      </div>

    `;

    return;

  }


  let html = "";


  list.forEach(user => {

    const role =
      getRole(user);


    const username =
      user.username ||
      user.userName ||
      user.name ||
      user.fullName ||
      user.displayName ||
      "بدون اسم";


    let badge = "";
    let cardClass = "";


    if(role === "admin"){

      badge =
        `<span class="badge badge-admin">
          👑 ADMIN
        </span>`;

      cardClass = "admin";

    }


    if(role === "manager"){

      badge =
        `<span class="badge badge-manager">
          🛡️ مسؤول
        </span>`;

      cardClass = "manager";

    }


    if(role === "member"){

      badge =
        `<span class="badge badge-member">
          👤 عضو
        </span>`;

    }


    /* جميع حقول المستخدم */

    let fields = "";


    Object.keys(user).forEach(key => {

      let value = user[key];


      fields += `

        <div class="field">

          <span class="key">
            ${esc(key)}
          </span>

          <span class="value">
            ${esc(formatValue(value))}
          </span>

        </div>

      `;

    });


    html += `

      <div class="card ${cardClass}">

        <div class="card-head">

          <div class="username">

            ${
              role === "admin"
              ? "👑"
              : role === "manager"
              ? "🛡️"
              : "👤"
            }

            ${esc(username)}

            ${badge}

          </div>


          <div class="uid">

            🆔 Document ID:
            ${esc(user.documentId)}

          </div>

        </div>


        <div class="data">

          <div class="grid">

            ${fields}

          </div>

        </div>

      </div>

    `;

  });


  container.innerHTML = html;

}


/* =========================================
   البحث المباشر
========================================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    searchUsers
  );


/* =========================================
   تشغيل
========================================= */

loadUsers();


/* تحديث تلقائي كل دقيقة */

setInterval(
  loadUsers,
  60000
);

</script>

</body>
</html>
