<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سجل المستخدمين</title>

<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  padding:18px;
  background:#f2f4f7;
  font-family:Arial,Tahoma,sans-serif;
}

.container{
  max-width:1000px;
  margin:auto;
}

.header{
  background:#202b4d;
  color:white;
  padding:20px;
  border-radius:16px;
  margin-bottom:18px;
  box-shadow:0 5px 20px #0002;
}

.header h2{
  margin:0 0 15px;
}

.search{
  width:100%;
  padding:15px;
  border:0;
  border-radius:10px;
  outline:none;
  font-size:16px;
  direction:ltr;
  text-align:left;
}

.count{
  margin-top:12px;
  font-size:13px;
  opacity:.85;
}

.section{
  padding:13px 16px;
  border-radius:11px;
  margin:18px 0 10px;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
}

.section-admin{
  background:#fff3cd;
  color:#664d03;
  border-right:5px solid #f0b429;
}

.section-users{
  background:#e9ecef;
  color:#495057;
  border-right:5px solid #777;
}

.number{
  background:#777;
  color:white;
  padding:3px 10px;
  border-radius:20px;
  font-size:12px;
}

.section-admin .number{
  background:#d99d00;
}

.user{
  background:white;
  border-radius:14px;
  margin-bottom:12px;
  padding:15px;
  display:flex;
  align-items:center;
  gap:14px;
  box-shadow:0 3px 12px #0001;
}

.avatar{
  width:55px;
  height:55px;
  min-width:55px;
  border-radius:50%;
  background:#667eea;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.info{
  flex:1;
  min-width:0;
}

.username{
  font-size:17px;
  font-weight:bold;
  color:#202b4d;
  word-break:break-word;
}

.phone{
  margin-top:5px;
  font-size:13px;
  color:#333;
  direction:ltr;
  text-align:right;
}

.uid{
  margin-top:4px;
  font-size:11px;
  color:#888;
  word-break:break-all;
}

.role{
  padding:6px 12px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
  white-space:nowrap;
}

.member{
  background:#e9ecef;
  color:#495057;
}

.admin{
  background:#fff3cd;
  color:#856404;
}

.manager{
  background:#d1ecf1;
  color:#0c5460;
}

.admin-user{
  border:2px solid #f0b429;
  background:#fffdf5;
}

.manager-user{
  border:2px solid #17a2b8;
}

.mark{
  margin-right:5px;
}

.loading,
.empty,
.error{
  background:white;
  padding:30px;
  border-radius:12px;
  text-align:center;
}

.error{
  background:#f8d7da;
  color:#842029;
}

@media(max-width:600px){

  body{
    padding:10px;
  }

  .user{
    align-items:flex-start;
  }

  .role{
    font-size:11px;
    padding:5px 8px;
  }

  .avatar{
    width:45px;
    height:45px;
    min-width:45px;
  }

}
</style>
</head>

<body>

<div class="container">

  <div class="header">

    <h2>📱 سجل المستخدمين</h2>

    <input
      id="search"
      class="search"
      type="tel"
      inputmode="tel"
      placeholder="اكتب رقم الهاتف للبحث..."
    >

    <div id="count">
      جاري تحميل المستخدمين...
    </div>

  </div>

  <div id="users">

    <div class="loading">
      ⏳ جاري تحميل البيانات...
    </div>

  </div>

</div>

<script>

/* =========================================
   Firebase
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyBSqx1BR2nf16PTJ5h7POC7ccYByPJtP6M",

  authDomain:
    "asse-app-16998.firebaseapp.com",

  projectId:
    "asse-app-16998",

  storageBucket:
    "asse-app-16998.firebasestorage.app",

  messagingSenderId:
    "835771799328",

  appId:
    "1:835771799328:web:b587a5da0cb129c2042945"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.firestore();

let users = [];


/* =========================================
   حماية النصوص
========================================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================
   تنظيف رقم الهاتف
========================================= */

function cleanPhone(phone){

  return String(phone || "")
    .replace(/[^\d+]/g,"");

}


/* =========================================
   معرفة الدور
========================================= */

function getRole(user){

  const role =
    String(user.role || "")
      .trim()
      .toLowerCase();


  /* مسؤول */

  if(

    role === "manager" ||
    role === "moderator" ||
    role === "مسؤول" ||
    role === "مسؤول النظام" ||

    user.isManager === true ||
    user.manager === true

  ){

    return "manager";

  }


  /* أدمن */

  if(

    role === "admin" ||
    role === "administrator" ||
    role === "مدير" ||

    user.isAdmin === true ||
    user.admin === true ||

    user.isAdmin === "true" ||
    user.admin === "true"

  ){

    return "admin";

  }


  return "member";

}


/* =========================================
   تحميل المستخدمين
========================================= */

async function loadUsers(){

  try{

    const snapshot =
      await db
        .collection("users")
        .get();


    users = [];


    snapshot.forEach(doc => {

      users.push({

        documentId:doc.id,

        ...doc.data()

      });

    });


    searchByPhone();


  }catch(error){

    document.getElementById("users")
      .innerHTML = `

        <div class="error">

          ❌ فشل تحميل المستخدمين

          <br><br>

          ${escapeHTML(error.message)}

        </div>

      `;

    document.getElementById("count")
      .textContent = "";

  }

}


/* =========================================
   البحث برقم الهاتف
========================================= */

function searchByPhone(){

  const input =
    cleanPhone(
      document.getElementById("search").value
    );


  let result;


  if(!input){

    result = users;

  }else{

    result = users.filter(user => {

      const phones = [

        user.phone,
        user.phoneNumber,
        user.mobile,
        user.tel,
        user.telephone

      ];


      return phones.some(phone => {

        const value =
          cleanPhone(phone);

        return value &&
               value.includes(input);

      });

    });

  }


  renderUsers(result);

}


/* =========================================
   عرض النتائج
========================================= */

function renderUsers(list){

  const container =
    document.getElementById("users");


  const managers =
    list.filter(
      u => getRole(u) === "manager"
    );

  const admins =
    list.filter(
      u => getRole(u) === "admin"
    );

  const members =
    list.filter(
      u => getRole(u) === "member"
    );


  document.getElementById("count")
    .textContent =
      `🛡️ مسؤول: ${managers.length} | 👑 أدمن: ${admins.length} | 👤 أعضاء: ${members.length}`;


  if(!list.length){

    container.innerHTML = `

      <div class="empty">

        📱 لا يوجد حساب بهذا الرقم

      </div>

    `;

    return;

  }


  let html = "";


  /* المسؤولون */

  if(managers.length){

    html += `

      <div class="section section-admin">

        <span>🛡️ المسؤولون</span>

        <span class="number">
          ${managers.length}
        </span>

      </div>

    `;


    managers.forEach(user => {

      html += createUser(user);

    });

  }


  /* الأدمن */

  if(admins.length){

    html += `

      <div class="section section-admin">

        <span>👑 الأدمن</span>

        <span class="number">
          ${admins.length}
        </span>

      </div>

    `;


    admins.forEach(user => {

      html += createUser(user);

    });

  }


  /* الأعضاء */

  if(members.length){

    html += `

      <div class="section section-users">

        <span>👤 الأعضاء</span>

        <span class="number">
          ${members.length}
        </span>

      </div>

    `;


    members.forEach(user => {

      html += createUser(user);

    });

  }


  container.innerHTML = html;

}


/* =========================================
   بطاقة المستخدم
========================================= */

function createUser(user){

  const role =
    getRole(user);


  const username =
    user.username ||
    user.userName ||
    user.name ||
    user.displayName ||
    "بدون Username";


  const phone =
    user.phone ||
    user.phoneNumber ||
    user.mobile ||
    user.tel ||
    user.telephone ||
    "غير موجود";


  const uid =
    user.uid ||
    user.documentId ||
    "غير موجود";


  let icon = "👤";

  if(role === "admin")
    icon = "👑";

  if(role === "manager")
    icon = "🛡️";


  let roleText = "عضو";
  let roleClass = "member";


  if(role === "admin"){

    roleText = "👑 أدمن";
    roleClass = "admin";

  }


  if(role === "manager"){

    roleText = "🛡️ مسؤول";
    roleClass = "manager";

  }


  return `

    <div class="user

      ${role === "admin" ? "admin-user" : ""}

      ${role === "manager" ? "manager-user" : ""}

    ">


      <div class="avatar">

        ${icon}

      </div>


      <div class="info">

        <div class="username">

          ${escapeHTML(username)}

          ${
            role === "admin"
            ? `<span class="mark">👑</span>`
            : ""
          }

          ${
            role === "manager"
            ? `<span class="mark">🛡️</span>`
            : ""
          }

        </div>


        <div class="phone">

          📱 ${escapeHTML(phone)}

        </div>


        <div class="uid">

          🆔 ${escapeHTML(uid)}

        </div>

      </div>


      <div class="role ${roleClass}">

        ${roleText}

      </div>


    </div>

  `;

}


/* =========================================
   البحث أثناء الكتابة
========================================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    searchByPhone
  );


/* =========================================
   تشغيل
========================================= */

loadUsers();


/* تحديث كل دقيقة */

setInterval(
  loadUsers,
  60000
);

</script>

</body>
</html>
