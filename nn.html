<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><title>Asse Firebase Dump</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,'Segoe UI',Tahoma,Arial,sans-serif}body{background:#0b1020;color:#e6e9f2;padding:12px;font-size:13px}h1{font-size:18px;margin-bottom:8px;color:#7ee8fa}h2{font-size:15px;margin:10px 0 6px;color:#ffcc70}.bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}button,input,select{background:#182046;color:#e6e9f2;border:1px solid #2a3570;border-radius:6px;padding:6px 10px;font-size:12px;cursor:pointer}button:hover{background:#25306b}input{min-width:180px}.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid #2a3570;margin-bottom:8px}.tab{padding:6px 12px;background:#151a35;border-radius:6px 6px 0 0;cursor:pointer;border:1px solid #2a3570;border-bottom:none;font-size:12px}.tab.active{background:#2a3570;color:#7ee8fa;font-weight:700}.status{padding:8px;background:#151a35;border-radius:6px;margin-bottom:8px;font-family:monospace;font-size:11px;max-height:120px;overflow:auto;white-space:pre-wrap;border:1px solid #2a3570}.wrap{overflow:auto;max-height:70vh;border:1px solid #2a3570;border-radius:6px;background:#0f1330}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #232a55;padding:5px 7px;text-align:right;vertical-align:top;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}th{background:#1c2450;position:sticky;top:0;color:#7ee8fa;cursor:pointer;z-index:2}tr:nth-child(even) td{background:#131836}tr:hover td{background:#25306b}td.mono{font-family:monospace;color:#9fe870}td.num{color:#ffcc70;font-weight:600}td.expand{white-space:normal;word-break:break-all;max-width:400px}.badge{display:inline-block;padding:1px 6px;border-radius:10px;font-size:10px;font-weight:700}.b-ok{background:#0f5132;color:#a3f7bf}.b-bad{background:#5c1a1a;color:#ffb3b3}.b-warn{background:#664d03;color:#ffe08a}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:6px;margin-bottom:8px}.stat{background:#151a35;padding:8px;border-radius:6px;border:1px solid #2a3570}.stat b{display:block;font-size:16px;color:#7ee8fa}.stat span{font-size:10px;color:#8891b8}details{background:#151a35;padding:6px;border-radius:6px;margin:4px 0;border:1px solid #2a3570}pre{background:#0a0e22;color:#9fe870;padding:8px;border-radius:6px;font-size:10px;overflow:auto;max-height:400px;white-space:pre-wrap;word-break:break-all}.hide{display:none}.warn{background:#5c1a1a;padding:6px 10px;border-radius:6px;color:#ffb3b3;font-size:11px;margin-bottom:8px}</style></head><body>
<h1>🔥 Asse.blog — Firebase Live Data Dump</h1>
<div class="warn">⚠️ للاستخدام البحثي/الأمني فقط. البيانات تُقرأ مباشرةً عبر Firestore REST API من مشروع <b>asse-app-16998</b>.</div>
<div class="bar">
<button onclick="loadAll()">🔄 تحميل / إعادة تحميل الكل</button>
<button onclick="loadOne()">📥 تحميل المجموعة المحددة فقط</button>
<select id="col"><option value="users">users</option><option value="settings">settings</option><option value="withdrawals">withdrawals</option><option value="deposits">deposits</option><option value="records">records</option><option value="logs">logs</option><option value="transactions">transactions</option><option value="referrals">referrals</option><option value="tasks">tasks</option><option value="admins">admins</option><option value="config">config</option><option value="messages">messages</option></select>
<input id="custom" placeholder="اسم مجموعة مخصص"><button onclick="addCustom()">+ إضافة</button>
<input id="q" placeholder="🔎 بحث..." oninput="filter()">
<button onclick="exp('json')">⬇ JSON</button><button onclick="exp('csv')">⬇ CSV</button>
</div>
<div id="stats" class="stats"></div>
<div id="status" class="status">جاهز. اضغط "تحميل الكل" لبدء استخراج البيانات من Firestore REST.</div>
<div id="tabs" class="tabs"></div>
<div id="views"></div>
<script>
const CFG={apiKey:"AIzaSyBSqx1BR2nf16PTJ5h7POC7ccYByPJtP6M",projectId:"asse-app-16998"};
const BASE=`https://firestore.googleapis.com/v1/projects/${CFG.projectId}/databases/(default)/documents`;
let COLS=["users","settings","withdrawals","deposits","records","logs","transactions","referrals","tasks","admins","config","messages"];
const DATA={};let ACTIVE=null;
const $=id=>document.getElementById(id);
function log(m,t="info"){const c={info:"#7ee8fa",ok:"#9fe870",err:"#ff7b7b",warn:"#ffcc70"}[t];$("status").innerHTML+=`\n<span style="color:${c}">[${new Date().toLocaleTimeString()}] ${m}</span>`;$("status").scrollTop=$("status").scrollHeight;}
function unwrap(v){if(v==null)return null;if("stringValue"in v)return v.stringValue;if("integerValue"in v)return +v.integerValue;if("doubleValue"in v)return +v.doubleValue;if("booleanValue"in v)return v.booleanValue;if("timestampValue"in v)return v.timestampValue;if("nullValue"in v)return null;if("arrayValue"in v)return(v.arrayValue.values||[]).map(unwrap);if("mapValue"in v)return unwrapFields(v.mapValue.fields||{});if("referenceValue"in v)return v.referenceValue;if("bytesValue"in v)return v.bytesValue;if("geoPointValue"in v)return v.geoPointValue;return v;}
function unwrapFields(f){const o={};for(const k in f)o[k]=unwrap(f[k]);return o;}
async function fetchCol(name){const out=[];let token=null,page=0;do{const u=new URL(`${BASE}/${name}`);u.searchParams.set("key",CFG.apiKey);u.searchParams.set("pageSize","300");if(token)u.searchParams.set("pageToken",token);const r=await fetch(u);if(!r.ok){const t=await r.text();throw new Error(`HTTP ${r.status}: ${t.slice(0,200)}`);}const j=await r.json();(j.documents||[]).forEach(d=>{const id=d.name.split("/").pop();out.push({_id:id,_path:d.name.replace(BASE+"/",""),_createTime:d.createTime,_updateTime:d.updateTime,...unwrapFields(d.fields||{})});});token=j.nextPageToken;page++;if(page>50)break;}while(token);return out;}
async function loadOne(){const c=$("col").value;await pullCol(c);render();}
async function loadAll(){$("status").innerHTML="";log("بدء التحميل من "+BASE);for(const c of COLS){await pullCol(c);}render();log("انتهى التحميل ✅","ok");}
async function pullCol(name){try{log("→ "+name);const rows=await fetchCol(name);DATA[name]=rows;log(`   ✓ ${name}: ${rows.length} وثيقة`,"ok");}catch(e){DATA[name]={_err:e.message};log(`   ✗ ${name}: ${e.message}`,"err");}}
function addCustom(){const v=$("custom").value.trim();if(v&&!COLS.includes(v)){COLS.push(v);const o=document.createElement("option");o.value=v;o.text=v;$("col").appendChild(o);log("أُضيفت: "+v,"warn");}}
function render(){const tabs=$("tabs"),views=$("views");tabs.innerHTML="";views.innerHTML="";let stats=[];let total=0,denied=0,ok=0;for(const c of Object.keys(DATA)){const d=DATA[c];const isErr=d&&d._err;const n=isErr?"⚠":(d?.length??0);total+=isErr?0:n;isErr?denied++:ok++;const t=document.createElement("div");t.className="tab";t.textContent=`${c} (${n})`;t.onclick=()=>show(c);tabs.appendChild(t);const v=document.createElement("div");v.id="v_"+c;v.className="hide";views.appendChild(v);buildTable(c,v);}$("stats").innerHTML=`<div class="stat"><span>مجموعات ناجحة</span><b>${ok}</b></div><div class="stat"><span>مجموعات فاشلة/مقفلة</span><b>${denied}</b></div><div class="stat"><span>إجمالي الوثائق</span><b>${total}</b></div><div class="stat"><span>المشروع</span><b style="font-size:11px">${CFG.projectId}</b></div>`;const first=Object.keys(DATA).find(k=>DATA[k]&&!DATA[k]._err&&DATA[k].length)||Object.keys(DATA)[0];if(first)show(first);}
function buildTable(name,el){const d=DATA[name];if(!d){el.innerHTML="<div class='warn'>لم تُحمَّل بعد.</div>";return;}if(d._err){el.innerHTML=`<div class='warn'>❌ فشل الوصول: <b>${d._err}</b><br>غالبًا: Firestore Security Rules تمنع القراءة العامة لهذه المجموعة، أو المجموعة غير موجودة.</div>`;return;}if(!d.length){el.innerHTML="<div class='warn'>لا توجد وثائق في هذه المجموعة (فارغة أو محمية).</div>";return;}const keys=new Set(["_id"]);d.forEach(r=>Object.keys(r).forEach(k=>keys.add(k)));const cols=[...keys];let html=`<h2>📁 ${name} — ${d.length} وثيقة</h2><div class="wrap"><table><thead><tr>`+cols.map((k,i)=>`<th onclick="sortT('${name}',${i})">${k}</th>`).join("")+"</tr></thead><tbody>";d.forEach(r=>{html+="<tr>"+cols.map(k=>{let v=r[k];let cls="";if(v==null)v="";else if(typeof v==="object"){v=JSON.stringify(v);cls="expand mono";}else if(typeof v==="number"){cls="num";}else if(typeof v==="boolean"){v=v?'<span class="badge b-ok">true</span>':'<span class="badge b-bad">false</span>';}else if(typeof v==="string"){if(v.length>60)cls="expand";if(/^0x[a-f0-9]{40}$/i.test(v)||/^T[A-Za-z0-9]{33}$/.test(v))cls="mono";}return`<td class="${cls}" title="${String(v).replace(/"/g,'&quot;').slice(0,500)}">${v}</td>`;}).join("")+"</tr>";});html+="</tbody></table></div><details><summary>عرض JSON خام</summary><pre>"+JSON.stringify(d,null,2).replace(/</g,"&lt;")+"</pre></details>";el.innerHTML=html;}
function show(c){ACTIVE=c;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.textContent.startsWith(c+" ")));document.querySelectorAll("#views > div").forEach(v=>v.classList.add("hide"));const el=$("v_"+c);if(el)el.classList.remove("hide");filter();}
function filter(){const q=$("q").value.toLowerCase();if(!ACTIVE)return;const el=$("v_"+ACTIVE);if(!el)return;el.querySelectorAll("tbody tr").forEach(r=>{r.style.display=!q||r.innerText.toLowerCase().includes(q)?"":"none";});}
let SDIR={};function sortT(name,i){const d=DATA[name];if(!d||d._err)return;const k=Object.keys({...d.reduce((a,r)=>({...a,...r}),{})})[i];SDIR[name+i]=!SDIR[name+i];const dir=SDIR[name+i]?1:-1;d.sort((a,b)=>{let x=a[k],y=b[k];if(x==null)return 1;if(y==null)return-1;if(typeof x==="number"&&typeof y==="number")return(x-y)*dir;return String(x).localeCompare(String(y))*dir;});const v=$("v_"+name);buildTable(name,v);show(name);}
function exp(fmt){if(!ACTIVE||!DATA[ACTIVE]||DATA[ACTIVE]._err){alert("لا بيانات");return;}const d=DATA[ACTIVE];let blob,ext;if(fmt==="json"){blob=new Blob([JSON.stringify(d,null,2)],{type:"application/json"});ext="json";}else{const keys=[...new Set(d.flatMap(r=>Object.keys(r)))];const esc=v=>{if(v==null)return"";if(typeof v==="object")v=JSON.stringify(v);return`"${String(v).replace(/"/g,'""')}"`;};const csv=[keys.join(","),...d.map(r=>keys.map(k=>esc(r[k])).join(","))].join("\n");blob=new Blob(["\ufeff"+csv],{type:"text/csv"});ext="csv";}const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`${CFG.projectId}_${ACTIVE}.${ext}`;a.click();}
loadAll();
</script></body></html>
