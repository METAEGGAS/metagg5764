<!DOCTYPE html><html dir="rtl" lang="ar"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة تحكم - طلبات التوثيق</title><style>*{box-sizing:border-box;font-family:Tahoma,Arial,sans-serif}body{margin:0;background:#0f1115;color:#eee;padding:16px}h1{margin:0 0 14px;font-size:20px}.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}.tabs button{background:#1a1d24;color:#eee;border:1px solid #2a2e38;border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:700}.tabs button.on{background:#ffd21f;color:#111;border-color:#ffd21f}.tabs .cnt{background:#ea3a53;color:#fff;border-radius:10px;padding:1px 7px;margin-inline-start:6px;font-size:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}.card{background:#161922;border:1px solid #262b36;border-radius:12px;padding:12px}.card h3{margin:0 0 8px;font-size:15px;color:#ffd21f;word-break:break-all}.row{display:flex;justify-content:space-between;gap:8px;margin:4px 0;font-size:13px;border-bottom:1px dashed #232833;padding-bottom:3px}.row b{color:#9aa4b2;font-weight:600}.row span{color:#fff;text-align:end;word-break:break-word;max-width:65%}.imgs{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.imgs img{width:70px;height:70px;object-fit:cover;border-radius:8px;border:1px solid #2a2e38;cursor:pointer}.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700}.bp{background:#3b82f6;color:#fff}.ba{background:#22c55e;color:#fff}.br{background:#ef4444;color:#fff}.acts{display:flex;gap:8px;margin-top:10px}.acts button{flex:1;border:0;border-radius:8px;padding:9px;font-weight:800;cursor:pointer;font-size:13px}.acts .ok{background:#22c55e;color:#fff}.acts .no{background:#ef4444;color:#fff}.acts button:disabled{opacity:.5;cursor:not-allowed}#login{max-width:340px;margin:80px auto;background:#161922;padding:22px;border-radius:12px;border:1px solid #262b36}#login input{width:100%;margin:6px 0;padding:10px;background:#0f1115;color:#fff;border:1px solid #2a2e38;border-radius:8px}#login button{width:100%;padding:11px;background:#ffd21f;color:#111;border:0;border-radius:8px;font-weight:800;cursor:pointer;margin-top:8px}#msg{color:#ea3a53;font-size:13px;min-height:16px}.empty{text-align:center;padding:40px;color:#777}.lv{background:#0f1115;border:1px solid #2a2e38;color:#ffd21f;font-size:11px;padding:2px 8px;border-radius:6px;margin-inline-start:6px}#lb{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:99;padding:20px}#lb img{max-width:100%;max-height:90vh;border-radius:8px}#lb.on{display:flex}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}.who{font-size:13px;color:#9aa4b2}.who button{background:transparent;color:#ea3a53;border:1px solid #ea3a53;border-radius:6px;padding:4px 10px;cursor:pointer;margin-inline-start:8px}</style><body><div id="login"><h1>دخول المشرف</h1><input id="em" type="email" placeholder="البريد الإلكتروني"><input id="pw" type="password" placeholder="كلمة المرور"><button id="lg">دخول</button><div id="msg"></div></div><div id="app" style="display:none"><div class="top"><h1>لوحة تحكم طلبات التوثيق</h1><div class="who"><span id="me"></span><button id="out">خروج</button></div></div><div class="tabs"><button data-f="pending" class="on">قيد المراجعة <span class="cnt" id="cP">0</span></button><button data-f="approved">مقبولة <span class="cnt" id="cA">0</span></button><button data-f="rejected">مرفوضة <span class="cnt" id="cR">0</span></button><button data-f="all">الكل <span class="cnt" id="cT">0</span></button></div><div id="list" class="grid"></div></div><div id="lb" onclick="this.classList.remove('on')"><img id="lbi"></div><script type="module">import{initializeApp,getApps}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";import{getAuth,setPersistence,browserLocalPersistence,onAuthStateChanged,signInWithEmailAndPassword,signOut}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";import{getFirestore,collection,getDocs,doc,updateDoc}from"https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";const cfg={apiKey:"AIzaSyBvzfJOOjRFZnTgTUrwEZQPr8Ba7zKKlNg",authDomain:"hhhxh-5ebe4.firebaseapp.com",projectId:"hhhxh-5ebe4",storageBucket:"hhhxh-5ebe4.firebasestorage.app",messagingSenderId:"79243000696",appId:"1:79243000696:web:ee0fb2d2ccce791954e68d",measurementId:"G-08BR6LN6PT"},app=getApps()[0]||initializeApp(cfg),auth=getAuth(app),db=getFirestore(app);const $=s=>document.querySelector(s),lg=$("#login"),ap=$("#app"),ls=$("#list"),msg=$("#msg");let ALL=[],FLT="pending";setPersistence(auth,browserLocalPersistence);onAuthStateChanged(auth,u=>{if(u){lg.style.display="none";ap.style.display="block";$("#me").textContent=u.email;load()}else{lg.style.display="block";ap.style.display="none"}});$("#lg").onclick=async()=>{msg.textContent="";try{await signInWithEmailAndPassword(auth,$("#em").value.trim(),$("#pw").value)}catch(e){msg.textContent=e.message}};$("#out").onclick=()=>signOut(auth);document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));b.classList.add("on");FLT=b.dataset.f;render()});const norm=s=>{s=(s||"").toString().trim().toLowerCase();if(["approved","ok","completed","success","مقبول","موافق"].includes(s))return"approved";if(["rejected","no","failed","denied","مرفوض"].includes(s))return"rejected";if(["pending","قيد معالجة","under review","pending"].includes(s)||s.includes("pending")||s.includes("قيد"))return"pending";return s||"pending"};async function load(){ls.innerHTML='<div class="empty">جارِ التحميل...</div>';ALL=[];try{const snap=await getDocs(collection(db,"users"));snap.forEach(d=>{const x=d.data()||{};if(x.kyc1||x.kyc2)ALL.push({uid:d.id,...x})});render()}catch(e){ls.innerHTML='<div class="empty">خطأ: '+e.message+'</div>'}}function fmt(t){if(!t)return"-";try{return new Date(t).toLocaleString("ar-EG",{hour12:!1})}catch(e){return t+""}}function esc(s){return(s+"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function bd(st){const n=norm(st);return`<span class="badge ${n==="approved"?"ba":n==="rejected"?"br":"bp"}">${n==="approved"?"مقبول":n==="rejected"?"مرفوض":"قيد المراجعة"}</span>`}function render(){let pC=0,aC=0,rC=0;const items=[];ALL.forEach(u=>{[["kyc1",1],["kyc2",2]].forEach(([k,lv])=>{const o=u[k];if(!o)return;const n=norm(o.status);if(n==="pending")pC++;else if(n==="approved")aC++;else if(n==="rejected")rC++;if(FLT!=="all"&&FLT!==n)return;items.push({uid:u.uid,k,lv,o})})});$("#cP").textContent=pC;$("#cA").textContent=aC;$("#cR").textContent=rC;$("#cT").textContent=pC+aC+rC;if(!items.length){ls.innerHTML='<div class="empty">لا توجد طلبات</div>';return}ls.innerHTML=items.map(({uid,k,lv,o})=>{let rows=`<div class="row"><b>UID</b><span>${esc(uid)}</span></div><div class="row"><b>الحالة</b><span>${bd(o.status)}</span></div><div class="row"><b>وقت الإرسال</b><span>${fmt(o.submittedAt)}</span></div>`;if(k==="kyc1"){rows+=`<div class="row"><b>الاسم الحقيقي</b><span>${esc(o.name||"-")}</span></div><div class="row"><b>المناطق</b><span>${esc(o.region||"-")}</span></div><div class="row"><b>عنوان السكن</b><span>${esc(o.address||"-")}</span></div>`}else{rows+=`<div class="row"><b>المهنة</b><span>${esc(o.job||"-")}</span></div><div class="row"><b>الدخل (USD)</b><span>${esc(o.income||"-")}</span></div><div class="row"><b>رقم الاتصال</b><span>${esc(o.phone||"-")}</span></div>`;if(Array.isArray(o.images)&&o.images.length){rows+='<div class="imgs">'+o.images.map(im=>{const src="data:"+(im.type||"image/jpeg")+";base64,"+(im.data||"");return`<img src="${src}" title="${esc(im.name||"")}" onclick="event.stopPropagation();document.getElementById('lbi').src=this.src;document.getElementById('lb').classList.add('on')">`}).join("")+"</div>"}}const dis=norm(o.status)!=="pending"?"disabled":"";return`<div class="card"><h3>${k==="kyc1"?"تحقق الهوية":"شهادة متقدمة"}<span class="lv">المستوى ${lv} KYC</span></h3>${rows}<div class="acts"><button class="ok" ${dis} data-u="${uid}" data-k="${k}" data-a="approved">قبول ✓</button><button class="no" ${dis} data-u="${uid}" data-k="${k}" data-a="rejected">رفض ✕</button></div></div>`}).join("");ls.querySelectorAll(".acts button").forEach(b=>b.onclick=async()=>{const u=b.dataset.u,k=b.dataset.k,a=b.dataset.a;if(!confirm(a==="approved"?"تأكيد قبول الطلب؟":"تأكيد رفض الطلب؟"))return;b.disabled=!0;try{await updateDoc(doc(db,"users",u),{[k+".status"]:a,[k+".reviewedAt"]:Date.now()});const it=ALL.find(x=>x.uid===u);if(it&&it[k]){it[k].status=a;it[k].reviewedAt=Date.now()}render()}catch(e){alert("خطأ: "+e.message);b.disabled=!1}})}</script>
